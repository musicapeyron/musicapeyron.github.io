<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Nome del sito: musicascuole.it (nessuna intestazione visibile a schermo, il nome resta solo qui e nel <title>) -->
<title>Spartiti — musicascuole.it</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Raccolte di brani con spartito e basi da ascoltare.">

<!--
  ============================================================
  PAGINA SPARTITI — per aggiungere una raccolta: crea la sua
  pagina (copiando per esempio diabelli.html) e aggiungi un
  blocco { ... } all'elenco "raccolte" in fondo alla pagina.
  ============================================================
-->

<link rel="stylesheet" href="comune.css">
<link rel="stylesheet" href="sito.css">
<style>
  /* ogni raccolta ha il suo colore: un anello intorno al tasto dell'icona */
  .raccolta .tasto { box-shadow: 0 0 0 3px var(--fondo), 0 0 0 6px var(--col); margin: 6px; }
  .raccolta .dati { margin-top: 0.4em; display: flex; flex-wrap: wrap; gap: 0.35em 0.9em; font-size: 0.78rem; font-weight: 700; color: var(--inchiostro-3); }
  .raccolta .dati span + span::before { content: "·"; margin-right: 0.9em; }
  .lv { display: inline-flex; align-items: center; justify-content: center; width: 1.3em; height: 1.3em; border-radius: 5px; font-size: 0.72rem; font-weight: 800; color: #141B3C; }
  .lv-P { background: #f9a8d4; } .lv-M { background: #fcd34d; } .lv-L { background: #93c5fd; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="freccia" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="barra-alta contenitore">
  <a class="casa" href="index.html" aria-label="Torna alla pagina principale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>musicascuole.it</a>
</div>

<header class="contenitore">
  <div class="lamella-titolo" style="--col: var(--sol);">
    <span class="tasto"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-spartiti"/></svg></span>
    <div><h1>Spartiti</h1><p>Spartiti progressivi, dai primi brani ai metodi classici: scegli una raccolta.</p></div>
  </div>
</header>

<main class="contenitore">
  <section class="sezione" aria-label="Raccolte di spartiti">
    <ul class="elenco" id="grid"></ul>
  </section>
</main>

<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>

<script>
  /* ============================================================
     ELENCO — per aggiungerne uno, copia un blocco { ... }
     ============================================================ */
  /* raccolte di spartiti, nell'ordine in cui compaiono */
  const raccolte = [
    { title: "Brani propedeutici", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-propedeutici"/></svg>', colore: "#E21C48", url: "brani-propedeutici.html",
      desc: "Il primo percorso: dal si al re, una novità alla volta, con disegni e basi.", quanti: "21 brani", livelli: ["P"] },
    { title: "Scale", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-scale"/></svg>', colore: "#F99D1C", url: "scale.html",
      desc: "Scale maggiori e minori, con le note alterate dall'armatura evidenziate.", quanti: "7 scale", livelli: ["M", "L"] },
    { title: "Primi Brani · prima parte", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-primi-brani-1"/></svg>', colore: "#009C95", url: "primi-brani.html",
      desc: "Brani da sol a re, con la melodia e la base da sola.", quanti: "6 brani", livelli: ["P", "M"] },
    { title: "Primi Brani · seconda parte", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-primi-brani-2"/></svg>', colore: "#5EC8D8", url: "primi-brani-2.html",
      desc: "Arrivano armatura, crome, ritornelli e volte.", quanti: "5 brani", livelli: ["P", "M"] },
    { title: "Diabelli", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-diabelli"/></svg>', colore: "#5E50A1", url: "diabelli.html",
      desc: "Dagli Studi melodici op. 149, con basi anche rallentate.", quanti: "9 brani", livelli: ["M"] },
    { title: "Berens", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-berens"/></svg>', colore: "#CF3E96", url: "berens.html",
      desc: "Dagli Esercizi melodici op. 62, in posizione fissa di cinque dita.", quanti: "8 brani", livelli: ["M"] },
    { title: "Sonatina in Do maggiore", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-sonatina"/></svg>', colore: "#BED958", url: "sonatina-do-maggiore.html",
      desc: "Per flauto dolce e pianoforte, con la base.", quanti: "1 brano", livelli: ["M"] }
  ];
  const NOMI_LIVELLO = { P: "Primaria", M: "Medie", L: "Liceo musicale" };
  /* i livelli (campo "livelli") restano nei dati ma per ora non si mostrano: per riattivarli MOSTRA_LIVELLI = true */
  const MOSTRA_LIVELLI = false;

  const FRECCIA = '<svg class="freccia" aria-hidden="true"><use href="#freccia"/></svg>';
  const grid = document.getElementById('grid');
  raccolte.forEach(t => {
    const li = document.createElement('li');
    li.innerHTML = `
      <a class="voce raccolta" href="${t.url}" style="--col: ${t.colore}">
        <span class="tasto">${t.icon}</span>
        <span class="testo">
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
          <span class="dati"><span>${t.quanti}</span><span>con basi</span>
            ${MOSTRA_LIVELLI ? t.livelli.map(l => `<span class="lv lv-${l}" title="${NOMI_LIVELLO[l]}">${l}</span>`).join('') : ''}</span>
        </span>
        ${FRECCIA}
      </a>`;
    grid.appendChild(li);
  });
</script>
</body>
</html>

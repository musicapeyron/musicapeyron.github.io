  }
  #secretLa {

  }

  header.hero p {
    font-size: calc(12.5 * var(--u));
    color: #9FB3CE;
    font-weight: 500;
    line-height: 1.45;
    max-width: calc(380 * var(--u));
    margin: 0 auto;

  /* ---------- staff line signature ---------- */
  .staff {
    max-width: calc(300 * var(--u));
    margin: calc(18 * var(--u)) auto calc(8 * var(--u));
    height: calc(32 * var(--u));
    position: relative;
  }
  .staff svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .staff line {
    stroke: rgba(255,255,255,0.14);
    stroke-width: 1;
  }
  /* La notina "cammina" sul rigo a scatti, suonando una scala
     mi-fa-sol-la-si-do-re-mi e ritorno, con i colori ufficiali delle note.
     A scatti (2 al secondo) invece che fluida: il telefono ridisegna
     2 volte al secondo invece di 60, quindi non scalda e consuma pochissimo. */
  /* chiave di violino: forma presa da VexFlow, la stessa degli esercizi */
  .staff .clef { fill: rgba(255,255,255,0.42); }
  .staff .melody-note {
    transform: translate(32px, 31px);
    fill: #FFF428;
    /* contorno chiaro sottile: il colore resta quello della nota,
       ma si stacca dallo sfondo (serve soprattutto al la, viola su viola) */
    stroke: rgba(255,255,255,0.7);
    stroke-width: 0.9;
    /* si muove con un piccolo timer in fondo alla pagina (risparmio energetico) */
  }
  @keyframes melody {
    0.0% { transform: translate(32.0px, 31px); fill: #FFF428; }
    7.143% { transform: translate(51.8px, 27.75px); fill: #BED958; }
    14.286% { transform: translate(71.7px, 24.5px); fill: #009C95; }
    21.429% { transform: translate(91.5px, 21.25px); fill: #5E50A1; }
    28.571% { transform: translate(111.4px, 18px); fill: #CF3E96; }
    35.714% { transform: translate(131.2px, 14.75px); fill: #E21C48; }
    42.857% { transform: translate(151.1px, 11.5px); fill: #F99D1C; }
    50.0% { transform: translate(170.9px, 8.25px); fill: #FFF428; }
    57.143% { transform: translate(190.8px, 11.5px); fill: #F99D1C; }
    64.286% { transform: translate(210.6px, 14.75px); fill: #E21C48; }
    71.429% { transform: translate(230.5px, 18px); fill: #CF3E96; }
    78.571% { transform: translate(250.3px, 21.25px); fill: #5E50A1; }
    85.714% { transform: translate(270.2px, 24.5px); fill: #009C95; }
    92.857% { transform: translate(290.0px, 27.75px); fill: #BED958; }
  }
  @media (prefers-reduced-motion: reduce) {
    .staff .melody-note { animation: none; }
  }

  /* ---------- tools grid ---------- */
  main {
    position: relative;
    z-index: 1;

    padding: 0 calc(20 * var(--u)) calc(40 * var(--u));
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(calc(190 * var(--u)), 1fr));
    gap: calc(10 * var(--u));
  }

  /* ---------- card in evidenza: Spartiti ---------- */
  .featured-card {

    align-items: center;
    gap: calc(14 * var(--u));
    background: linear-gradient(135deg, rgba(94,200,216,0.12), rgba(255,255,255,0.035));

    border-radius: calc(14 * var(--u));
    padding: calc(14 * var(--u)) calc(18 * var(--u));

    color: inherit;
    margin-bottom: calc(16 * var(--u));

  }
  .featured-card:hover {
    border-color: rgba(94,200,216,0.6);
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(94,200,216,0.18), rgba(255,255,255,0.05));

  .featured-card .icon {

    height: calc(34 * var(--u));

  .featured-card .arrow {

  }

  .featured-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: calc(10 * var(--u));
    margin-bottom: calc(16 * var(--u));
  }
  .featured-row .featured-card { margin-bottom: 0; }
  @media (max-width: 600px) { .featured-row { grid-template-columns: 1fr; } }
  .featured-giochi {

  .featured-giochi .icon { background: rgba(249,157,28,0.18); }
  .featured-giochi .arrow { color: #F99D1C; }

  .divider {
    height: 1px;

    margin: 0 0 calc(16 * var(--u));

  /* ---------- sezioni ---------- */
  .group { margin-top: calc(22 * var(--u)); }
  .group:first-of-type { margin-top: calc(4 * var(--u)); }
  .group-title {
    display: flex; align-items: center; gap: calc(8 * var(--u));
    font-family: 'Manrope', sans-serif; font-weight: 800;
    font-size: calc(12 * var(--u)); letter-spacing: 0.08em; text-transform: uppercase;
    color: #cbd5e1; margin: 0 0 calc(10 * var(--u)); padding-left: calc(10 * var(--u));
    border-left: 3px solid var(--accent);
  }
  .group-giochi    { --accent: #F99D1C; }
  .group-base      { --accent: #5EC8D8; }
  .group-avanzati  { --accent: #a78bfa; }
  .group .card, .group .card:hover { border-top: 2px solid var(--accent); }
  .group .card .label { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .group-giochi .card { background: linear-gradient(180deg, rgba(249,157,28,0.08), rgba(255,255,255,0.03)); }

  .card {
    position: relative;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: calc(12 * var(--u));
    padding: calc(11 * var(--u)) calc(12 * var(--u)) calc(11 * var(--u));
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    display: flex;
    flex-direction: column;
    /* tutta la card è il link al gioco */
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid #5EC8D8; outline-offset: 2px; }

  .card:hover {
    border-color: rgba(94, 200, 216, 0.45);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
  }

  .card .top-row {
    display: flex;

    justify-content: space-between;
    margin-bottom: calc(7 * var(--u));

  .card .icon {
    width: calc(25 * var(--u));

    align-items: center;
    justify-content: center;
    font-size: calc(13 * var(--u));
    flex-shrink: 0;
  }

  .card .label {
    font-size: calc(9 * var(--u));
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #7FD8E4;
    background: rgba(94, 200, 216, 0.1);
    padding: calc(2 * var(--u)) calc(7 * var(--u));
    border-radius: calc(999 * var(--u));
  }

  .card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: calc(13.5 * var(--u));
    margin: 0 0 calc(4 * var(--u));

  }

  .card p {

    font-weight: 500;
    margin: 0;

  /* empty slot */
  .card.empty {

    justify-content: center;
    text-align: center;
    border-style: dashed;

  .card.empty .plus {

  #grid { grid-template-columns: repeat(auto-fill, minmax(calc(340 * var(--u)), 1fr)); gap: calc(14 * var(--u)); }

  .etichette .chip { font-size: calc(11 * var(--u)); font-weight: 700; color: #EAF2FF; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12); border-radius: calc(999 * var(--u)); padding: calc(2 * var(--u)) calc(9 * var(--u)); }
  .etichette .lv { display: inline-flex; align-items: center; justify-content: center; width: calc(18 * var(--u)); height: calc(18 * var(--u)); border-radius: calc(5 * var(--u));
    font-size: calc(10.5 * var(--u)); font-weight: 800; color: #0f172a; }

  .card.raccolta .freccia { flex: none; color: var(--col); font-size: calc(20 * var(--u)); font-weight: 700; opacity: .8; transition: transform .2s; }

  @media (max-width: 600px) { #grid { grid-template-columns: 1fr; } .card.raccolta { padding: calc(13 * var(--u)) calc(12 * var(--u)) calc(13 * var(--u)) calc(14 * var(--u)); }
    .icona-raccolta { width: calc(46 * var(--u)); height: calc(46 * var(--u)); font-size: calc(22 * var(--u)); } }
  .ico { width: 70%; height: 70%; display: block; overflow: visible; }

  /* schermi larghi: contenuto più largo */
  main { max-width: calc(1120 * var(--u)); }
  /* LIM e schermi touch: l'effetto "passaggio del mouse" non resta attaccato dopo il tocco;

    .card:hover, .featured-card:hover, .site-home-button:hover, .casetta:hover { transform: none; }

</style>

<script>
  /* Titolo su una sola riga: se non ci sta, riduce la dimensione del testo
     quanto basta (dipende dalla larghezza dello schermo e dal carattere caricato) */
  function fitTitle() {
    const h1 = document.querySelector('header.hero h1');
    h1.style.fontSize = '';
    let size = parseFloat(getComputedStyle(h1).fontSize);
    while (h1.scrollWidth > h1.clientWidth && size > 11) {
      size -= 0.5;
      h1.style.fontSize = size + 'px';
    }
  }
  fitTitle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  window.addEventListener('resize', fitTitle);

  /* ============================================================
     ELENCO — per aggiungerne uno, copia un blocco { ... }
     ============================================================ */
  /* raccolte di spartiti, nell'ordine in cui compaiono */
  const raccolte = [
    { title: "Brani propedeutici", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-propedeutici"/></svg>', colore: "#E21C48", url: "brani-propedeutici.html",
      desc: "Il primo percorso: dal si al re, una novità alla volta, con disegni e basi.", quanti: "21 brani", livelli: ["P"] },

    { title: "Primi Brani · prima parte", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-primi-brani-1"/></svg>', colore: "#009C95", url: "primi-brani.html",

    { title: "Primi Brani · seconda parte", icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-primi-brani-2"/></svg>', colore: "#5EC8D8", url: "primi-brani-2.html",

      desc: "Per flauto dolce e pianoforte, con la base.", quanti: "1 brano", livelli: ["M"] }
  ];
  const NOMI_LIVELLO = { P: "Primaria", M: "Medie", L: "Liceo musicale" };
  /* i livelli (campo "livelli") restano nei dati ma per ora non si mostrano: per riattivarli MOSTRA_LIVELLI = true */
  const MOSTRA_LIVELLI = false;

  const grid = document.getElementById('grid');
  raccolte.forEach(t => {
    const card = document.createElement('a');
    card.className = 'card raccolta';
    card.href = t.url;
    card.style.setProperty('--col', t.colore);
    card.innerHTML = `
      <div class="icona-raccolta">${t.icon}</div>
      <div class="testo-raccolta">

        </div>
      </div>
      <span class="freccia" aria-hidden="true">→</span>`;
    grid.appendChild(card);

</script>

<script>
/* risparmio energetico: la notina sul rigo si sposta con un timer due volte al secondo
   (un'animazione CSS con i colori obbliga il telefono a ricalcolare la pagina 60 volte al secondo).
   Si ferma quando la pagina non è visibile o il rigo è fuori dallo schermo. */
(function () {
  const nota = document.querySelector(".staff .melody-note"); if (!nota) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const X = [32.0, 51.8, 71.7, 91.5, 111.4, 131.2, 151.1, 170.9, 190.8, 210.6, 230.5, 250.3, 270.2, 290.0];
  const Y = [31, 27.75, 24.5, 21.25, 18, 14.75, 11.5, 8.25, 11.5, 14.75, 18, 21.25, 24.5, 27.75];
  const C = ["#FFF428", "#BED958", "#009C95", "#5E50A1", "#CF3E96", "#E21C48", "#F99D1C", "#FFF428", "#F99D1C", "#E21C48", "#CF3E96", "#5E50A1", "#009C95", "#BED958"];
  let i = 0, timer = null, inVista = true;
  const passo = () => { i = (i + 1) % X.length; nota.setAttribute("transform", "translate(" + X[i] + " " + Y[i] + ")"); nota.style.fill = C[i]; };
  const aggiorna = () => { const via = inVista && !document.hidden; if (via && !timer) timer = setInterval(passo, 500); if (!via && timer) { clearInterval(timer); timer = null; } };
  nota.style.transform = "none"; nota.setAttribute("transform", "translate(" + X[0] + " " + Y[0] + ")");
  document.addEventListener("visibilitychange", aggiorna);
  if ("IntersectionObserver" in window) new IntersectionObserver(e => { inVista = e[0].isIntersecting; aggiorna(); }).observe(nota.closest("svg") || nota);
  aggiorna();
})();
</script>

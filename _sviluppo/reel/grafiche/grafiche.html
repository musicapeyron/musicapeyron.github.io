<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url(../../../fonts/inter.woff)}
@font-face{font-family:Manrope;font-weight:200 800;src:url(../../../fonts/manrope.woff)}
:root{--do:#E21C48;--re:#F99D1C;--mi:#FFF428;--fa:#BED958;--sol:#009C95;--la:#5E50A1;--si:#CF3E96;--ink:#17133f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:Manrope,Inter,sans-serif}
.navy{position:absolute;inset:0;background:radial-gradient(900px 900px at 25% 18%,#3a2f9a 0%,#241d63 38%,#17133f 70%,#0f0d2a 100%)}
.full{position:absolute;inset:0}
@keyframes pop{0%{transform:translateY(60px) scale(.85);opacity:0}60%{transform:translateY(-6px) scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pop{opacity:0;animation:pop .45s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;animation:fade .35s ease forwards}
/* text card */
.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 90px 180px}
.card .l{font-weight:800;font-size:132px;line-height:1.02;letter-spacing:-.03em}
.card .s{font-weight:700;font-size:54px;margin-top:40px;opacity:.9}
.card .tag{position:absolute;top:290px;left:90px;font-weight:800;font-size:40px;opacity:.85;letter-spacing:-.01em}
.card .bar{height:18px;width:260px;border-radius:9px;margin:0 0 54px;transform-origin:left;animation:grow .5s .1s ease-out both}
/* hook overlay */
.band{position:absolute;left:0;right:0;top:0;height:780px;background:linear-gradient(#0f0d2a 0%,#0f0d2a 76%,rgba(15,13,42,0) 100%)}
.hook{position:absolute;left:80px;right:80px;top:250px}
.hook .a{font-weight:800;font-size:84px;color:#fff;letter-spacing:-.02em;line-height:1.05}
.hook .g{display:inline-block;margin:18px 0 14px;font-weight:800;font-size:170px;line-height:1;letter-spacing:-.04em;color:var(--ink);background:var(--mi);padding:6px 34px 16px;border-radius:40px;box-shadow:0 12px 0 #c9bf12}
/* label pill */
.fascia{position:absolute;left:0;right:0;top:0;height:500px;background:linear-gradient(#0f0d2a 0%,#0f0d2a 72%,rgba(15,13,42,0) 100%)}
.lwrap{position:absolute;left:0;right:0;top:250px;display:flex;justify-content:center}
.label{white-space:nowrap;display:flex;align-items:center;gap:22px;
 background:rgba(15,13,42,.88);border:3px solid rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:54px;padding:22px 44px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.label i{width:30px;height:30px;border-radius:50%;display:block}
.sub{position:absolute;left:0;right:0;text-align:center;color:#d9d6ff;font-weight:700;font-size:44px}
/* end */
.end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 80px 260px}
.word{font-family:Inter;font-weight:800;font-size:126px;color:#f1efff;letter-spacing:-.045em;line-height:1}
.tagl{font-family:Inter;font-weight:700;font-size:46px;color:#cfcaff;line-height:1.3;margin-top:34px}
.pills{display:flex;gap:16px;margin-top:56px;flex-wrap:nowrap}
.pill{font-family:Inter;font-weight:800;font-size:50px;padding:14px 0 18px;width:118px;text-align:center;border-radius:999px;color:#fff}
.mail{margin-top:90px;display:inline-flex;align-self:flex-start;flex-direction:column;gap:10px}
.mail .k{font-family:Inter;font-weight:700;font-size:40px;color:#bdb8f5}
.mail .v{font-family:Inter;font-weight:800;font-size:62px;color:var(--ink);background:#fff;padding:18px 40px 22px;border-radius:28px}
.foot{position:absolute;left:80px;top:300px;font-family:Inter;font-weight:700;font-size:40px;color:#9d98d6}
.frame{position:absolute;border-radius:36px;box-shadow:0 0 0 14px #0b0a1f,0 0 0 17px rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.6)}
.lim{position:absolute;border-radius:14px;box-shadow:0 0 0 26px #2b2b33,0 0 0 30px #4a4a55,0 40px 90px rgba(0,0,0,.6)}
.limfoot{position:absolute;height:22px;border-radius:0 0 12px 12px;background:#3a3a44}
/* copertina: tutto dentro il riquadro 1080x1440 centrale (griglia del profilo, 3:4) */
.cop{position:absolute;left:0;right:0;top:240px;height:1440px;display:flex;flex-direction:column;padding:56px 80px 50px}
.cop .sito{font-family:Inter;font-weight:800;font-size:40px;color:#bdb8f5;letter-spacing:-.02em}
.cop .bar{height:16px;width:220px;border-radius:8px;margin:34px 0 30px}
.cop .t{font-weight:800;font-size:118px;line-height:1.02;letter-spacing:-.035em;color:#fff;white-space:nowrap}
.cop .st{font-weight:700;font-size:46px;color:#d9d6ff;margin-top:26px}
.cop .tel{flex:1;min-height:0;margin-top:44px;display:flex;justify-content:center}
.cop .tel img{height:100%;aspect-ratio:9/16;object-fit:cover;object-position:top;border-radius:34px;
 box-shadow:0 0 0 12px #0b0a1f,0 0 0 15px rgba(255,255,255,.16),0 30px 70px rgba(0,0,0,.55)}
.cop .pills{margin-top:auto}
/* bolle dei suoni (giochi d'ascolto): "1" e "2" si accendono quando suonano; n=istanti, f=istante del tocco */
.bolle{position:absolute;left:0;right:0;top:800px;height:400px;display:flex;justify-content:center;align-items:center;gap:110px}
.bolla{position:relative;width:240px;height:240px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-family:Inter;font-weight:800;font-size:130px;color:#fff;opacity:.28;transform:scale(.9);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.bolla.uno{background:linear-gradient(160deg,#4fb3ff,#1f7fd1)} .bolla.due{background:linear-gradient(160deg,#ffb04d,#f07a12)}
.bolla .onda{position:absolute;inset:-6px;border-radius:50%;border:10px solid #fff;opacity:0}
@keyframes accendi{0%{opacity:.28;transform:scale(.9)}35%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes onda{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.75)}}
@keyframes via{to{opacity:0;transform:translateY(-30px)}}
.domanda{position:absolute;left:0;right:0;top:1195px;text-align:center;font-weight:800;font-size:46px;color:#fff;opacity:0;
 text-shadow:0 4px 18px rgba(0,0,0,.6)}
/* titolo "adesivo": scritta grande su un riquadro colorato inclinato, sottotitolo evidenziato in giallo */
.tt{position:absolute;left:50px;right:50px;top:var(--top,250px);display:flex;flex-direction:column;align-items:center;gap:22px}
.tt .ttb{font-weight:800;font-size:92px;line-height:1.03;text-align:center;letter-spacing:-.03em;padding:16px 38px 24px;border-radius:32px;
 white-space:nowrap;box-shadow:0 10px 0 rgba(0,0,0,.28),0 26px 50px rgba(0,0,0,.45);transform:rotate(-3deg)}
.tt .tts{font-weight:800;font-size:50px;color:#17133f;background:#FFF428;padding:10px 28px 14px;border-radius:18px;white-space:nowrap;
 box-shadow:0 8px 0 #c9bf12,0 18px 36px rgba(0,0,0,.35);transform:rotate(2deg)}
@keyframes adesivo{0%{opacity:0;transform:scale(.3) rotate(-14deg)}55%{opacity:1;transform:scale(1.12) rotate(2deg)}75%{transform:scale(.96) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
@keyframes adesivo2{0%{opacity:0;transform:translateY(40px) rotate(8deg)}60%{opacity:1;transform:translateY(-6px) rotate(0deg)}100%{opacity:1;transform:rotate(2deg)}}
</style></head><body><div id="root"></div>
<script>
const P=new URLSearchParams(location.hash.slice(1));const R=document.getElementById('root');const t=P.get('t');
const C={do:'#E21C48',re:'#F99D1C',mi:'#FFF428',fa:'#BED958',sol:'#009C95',la:'#5E50A1',si:'#CF3E96'};
const darkText={re:1,mi:1,fa:1};
function d(s){return `style="animation-delay:${s}s"`}
if(t==='card'){
  const c=P.get('c'), fg=darkText[c]?'#17133f':'#fff';
  const lines=P.get('l').split('|'); const sub=P.get('s');
  const tel=P.get('tel');   // tel=1: testi in alto, sotto lo spazio per i mini-telefoni (monta.py)
  R.innerHTML=`<div class="full" style="background:${C[c]}"></div>
  <div class="card" style="color:${fg}${tel?';justify-content:flex-start;padding:330px 90px 0':''}">
   <div class="bar" style="background:${fg};opacity:.9"></div>
   ${lines.map((x,i)=>`<div class="l pop" ${d(.08+i*.22)}>${x}</div>`).join('')}
   ${sub?`<div class="s pop" ${d(.08+lines.length*.22)}>${sub}</div>`:''}
  </div>`;
  const ls=[...R.querySelectorAll('.l')]; let fs=132;
  const fits=()=>ls.every(e=>{e.style.display='inline-block';const w=e.scrollWidth;e.style.display='';return w<=900});
  ls.forEach(e=>e.style.fontSize=fs+'px'); while(!fits()&&fs>60){fs-=4;ls.forEach(e=>e.style.fontSize=fs+'px')}
  if(tel){ // tutto il testo deve finire sopra i telefoni (y=900)
    const fondo=()=>Math.max(...[...R.querySelectorAll('.card > *')].map(e=>e.offsetTop+e.offsetHeight));
    while(fondo()>900&&fs>60){fs-=4;ls.forEach(e=>e.style.fontSize=fs+'px')}
  }
}
function bolle(){ // usate dall'apertura (hook) e dal tipo "sfida"
  const n=(P.get('n')||'').split(',').filter(Boolean).map(Number), f=+(P.get('f')||0);
  if(n.length<2) return '';
  const b=(cl,num,t)=>`<div class="bolla ${cl}" style="animation:fade .2s .1s both,accendi .45s ${t}s forwards">${num}`+
     `<div class="onda" style="animation:onda .9s ${t}s forwards"></div></div>`;
  const q=P.get('q')||'Il primo, il secondo… o unisono?';
  return `<div class="bolle" ${f?`style="animation:via .25s ${f-0.1}s forwards"`:''}>${b('uno',1,n[0])}${b('due',2,n[1])}</div>`+
    `<div class="domanda" style="animation:fade .3s ${n[1]+0.9}s forwards${f?`,via .25s ${f-0.1}s forwards`:''}">${q}</div>`;
}
if(t==='sfida'){ R.innerHTML=bolle(); }
if(t==='titolo'){ // titolo "adesivo" (l = titolo, s = sottotitolo in giallo, c = colore, top = altezza)
  const c=P.get('c')||'sol', fg=darkText[c]?'#17133f':'#fff';
  R.innerHTML=`<div class="tt" style="--top:${P.get('top')||250}px">
    <div class="ttb" style="background:${C[c]};color:${fg};opacity:0;animation:adesivo .55s cubic-bezier(.2,.8,.2,1) .05s forwards">${P.get('l').split('|').join('<br>')}</div>
    ${P.get('s')?`<div class="tts" style="opacity:0;animation:adesivo2 .45s ease-out .35s forwards">${P.get('s')}</div>`:''}</div>`;
  R.querySelectorAll('.tt .ttb,.tt .tts').forEach(e=>{const big=e.classList.contains('ttb');let fs=big?92:50;
    while(e.scrollWidth>(big?960:940)&&fs>(big?48:30)){fs-=2;e.style.fontSize=fs+'px'}});
}
if(t==='hook'){
  // testi cambiabili: a (sopra), g (nella pastiglia gialla), b (sotto); se una riga è troppo larga si rimpicciolisce
  const A=P.get('a')||'Giochi musicali', G=P.get('g')||'GRATIS', B=P.get('b')||'per la tua classe';
  R.innerHTML=`<div class="band fade" style="animation-duration:.2s"></div><div class="hook">
   ${P.get('fondo') ? `<div class="a pop" ${d(0)}>${A}</div><div class="a pop" ${d(.18)}>${B}</div><div class="g pop" ${d(.4)}>${G}</div>`
     : `<div class="a pop" ${d(0)}>${A}</div><div class="g pop" ${d(.18)}>${G}</div><div class="a pop" ${d(.36)}>${B}</div>`}</div>`+bolle();
  R.querySelectorAll('.hook .a').forEach(e=>{let fs=84;e.style.whiteSpace='nowrap';
    while(e.scrollWidth>920&&fs>50){fs-=2;e.style.fontSize=fs+'px'}});
  R.querySelectorAll('.hook .g').forEach(e=>{let fs=170;e.style.whiteSpace='nowrap';
    while(e.offsetWidth>920&&fs>80){fs-=4;e.style.fontSize=fs+'px'}});
}
if(t==='label'){ // fascia=1 (altezza fh, di serie 500): fascia scura dietro l'etichetta, per le pagine che hanno già testo in alto
  R.innerHTML=(P.get('fascia')?`<div class="fascia fade" style="animation-duration:.15s;height:${P.get('fh')||500}px"></div>`:'')+`<div class="lwrap"><div class="label pop" ${d(.05)}><i style="background:${C[P.get('c')]}"></i>${P.get('l')}</div></div>`+
   (P.get('s')?`<div class="sub fade" style="top:${P.get('sy')||1560}px;animation-delay:.3s">${P.get('s')}</div>`:'');
}
if(t==='bg'){ // background with frame for landscape clips; frame rect params
  const x=+P.get('x'),y=+P.get('y'),w=+P.get('w'),h=+P.get('h'),k=P.get('k');
  R.innerHTML=`<div class="navy"></div>`+(k==='lim'?`<div class="lim" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:#000"></div>`:
   `<div class="frame" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:#000"></div>`);
}
if(t==='end'){
  const notes=['do','re','mi','fa','sol','la','si'];
  R.innerHTML=`<div class="navy"></div><div class="end">
   <div class="word pop" ${d(.05)}>musicascuole.it</div>
   <div class="pills">${notes.map((n,i)=>`<div class="pill pop" style="animation-delay:${.35+i*.08}s;background:${C[n]};color:${darkText[n]?'#17133f':'#fff'};box-shadow:0 8px 0 rgba(0,0,0,.28)">${n}</div>`).join('')}</div>
   <div class="tagl fade" ${d(.95)}>Giochi, spartiti, solfeggio e storia<br>della musica per la scuola.</div>
   <div class="mail pop" ${d(1.25)}><span class="k">Idee, segnalazioni, collaborazioni:</span><span class="v">info@musicascuole.it</span></div>
  </div>`;
}
if(t==='classe'){
  // Un'aula vista dal fondo: la LIM sul muro (lo schermo è il rettangolo x,y,w,h, dove monta.py
  // mette la clip), i banchi con le sedie vuote (nessuna persona), la cattedra, la finestra.
  // Serve a far capire quanto è grande il gioco sulla LIM. Di serie x=130 y=480 w=820 h=461 (16:9).
  const x=+(P.get('x')||130), y=+(P.get('y')||480), w=+(P.get('w')||820), h=+(P.get('h')||461);
  const ox=Math.min(1030, x+w+40);   // orologio sul muro a destra della LIM, fuori dalla frase sotto l'etichetta
  // banco biposto con due sedie vuote, visti dal fondo dell'aula (s = scala: più vicino, più grande)
  const sedia=(cx,b,s)=>`<rect x="${cx-50*s}" y="${b-30*s}" width="${100*s}" height="${16*s}" rx="${5*s}" fill="#3a3f5c"/>`+
      `<rect x="${cx-46*s}" y="${b-14*s}" width="${8*s}" height="${62*s}" fill="#2e3250"/><rect x="${cx+38*s}" y="${b-14*s}" width="${8*s}" height="${62*s}" fill="#2e3250"/>`+
      `<rect x="${cx-8*s}" y="${b-112*s}" width="${16*s}" height="${84*s}" fill="#2e3250"/>`+
      `<rect x="${cx-58*s}" y="${b-150*s}" width="${116*s}" height="${52*s}" rx="${12*s}" fill="#4d5374"/>`;
  const banco=(px,b,s)=>`<rect x="${px-205*s}" y="${b-150*s}" width="${410*s}" height="${24*s}" rx="${5*s}" fill="#d6b089"/>`+
      `<rect x="${px-195*s}" y="${b-126*s}" width="${390*s}" height="${70*s}" fill="#a77b55"/>`+
      `<rect x="${px-190*s}" y="${b-56*s}" width="${10*s}" height="${100*s}" fill="#7d5a3c"/><rect x="${px+180*s}" y="${b-56*s}" width="${10*s}" height="${100*s}" fill="#7d5a3c"/>`+
      sedia(px-100*s,b+40*s,s)+sedia(px+100*s,b+40*s,s);
  const file=[[1300,.6,[290,790]],[1580,.86,[245,835]],[1930,1.18,[170,910]]];
  let doghe=''; for(let i=0;i<11;i++){const a=540+(i-5)*70, b2=540+(i-5)*430; doghe+=`<line x1="${a}" y1="1160" x2="${b2}" y2="1920" stroke="#fff" stroke-opacity=".07" stroke-width="3"/>`;}
  R.innerHTML=`<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
   <defs>
    <linearGradient id="muro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a40a8"/><stop offset="1" stop-color="#2d2672"/></linearGradient>
    <linearGradient id="pav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2468"/><stop offset="1" stop-color="#151236"/></linearGradient>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc6ff"/><stop offset="1" stop-color="#d7ecff"/></linearGradient>
    <radialGradient id="alone" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9a8cff" stop-opacity=".45"/><stop offset="1" stop-color="#9a8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="luce" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
   </defs>
   <rect width="1080" height="1160" fill="url(#muro)"/>
   <rect y="1010" width="1080" height="150" fill="#262061"/><rect y="1006" width="1080" height="6" fill="#5a50b8"/>
   <rect y="1160" width="1080" height="760" fill="url(#pav)"/>${doghe}<rect y="1152" width="1080" height="10" fill="#1b1745"/>
   <rect x="-10" y="380" width="88" height="540" rx="6" fill="#d8d3f5"/><rect x="0" y="392" width="66" height="516" fill="url(#cielo)"/>
   <rect x="0" y="646" width="66" height="8" fill="#d8d3f5"/><polygon points="66,392 66,908 330,1160 180,1160" fill="url(#luce)"/>
   <ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w*.85}" ry="${h*.95}" fill="url(#alone)"/>
   <rect x="${x-58}" y="${y+24}" width="36" height="${h*.5}" rx="8" fill="#1c1940"/><rect x="${x+w+22}" y="${y+24}" width="36" height="${h*.5}" rx="8" fill="#1c1940"/>
   <rect x="${x-18}" y="${y-18}" width="${w+36}" height="${h+36}" rx="12" fill="#e4e2ee"/><rect x="${x-8}" y="${y-8}" width="${w+16}" height="${h+16}" rx="6" fill="#2a2a33"/>
   <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000"/>
   <rect x="${x+w*.18}" y="${y+h+18}" width="${w*.64}" height="18" rx="6" fill="#c9c6d8"/>
   <rect x="${x+w*.3}" y="${y+h+12}" width="40" height="8" rx="3" fill="#E21C48"/><rect x="${x+w*.3+50}" y="${y+h+12}" width="40" height="8" rx="3" fill="#009C95"/>
   <circle cx="${ox}" cy="${y-92}" r="40" fill="#f4f2fb" stroke="#d6d2ea" stroke-width="6"/>
   <line x1="${ox}" y1="${y-92}" x2="${ox}" y2="${y-118}" stroke="#2a2440" stroke-width="5" stroke-linecap="round"/>
   <line x1="${ox}" y1="${y-92}" x2="${ox+18}" y2="${y-84}" stroke="#2a2440" stroke-width="5" stroke-linecap="round"/>
   <rect x="660" y="1048" width="380" height="26" rx="5" fill="#c99e73"/><rect x="672" y="1074" width="356" height="110" fill="#8f6542"/>
   <rect x="760" y="1004" width="120" height="44" rx="4" fill="#2b2b3a"/><rect x="742" y="1044" width="156" height="8" rx="3" fill="#51516a"/>
   ${file.map(([b,s,ps])=>ps.map(px=>banco(px,b,s)).join('')).join('')}
  </svg>`;
}
if(t==='pila'){ // più schermi orizzontali uno sopra l'altro: cornici e etichette (monta.py ci mette le clip)
  const ys=P.get('y').split(',').map(Number), h=+P.get('h'), x=+(P.get('x')||40), w=+(P.get('w')||1000);
  const ls=(P.get('l')||'').split('|'), cs=(P.get('c')||'do|mi|sol').split('|');
  R.innerHTML=`<div class="navy"></div>`+ys.map((y,i)=>
    `<div class="frame" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:#000;border-radius:22px"></div>`+
    (ls[i]?`<div style="position:absolute;left:${x+6}px;top:${y-72}px;font-weight:800;font-size:42px;padding:8px 28px 12px;border-radius:16px;z-index:2;background:${C[cs[i]]||cs[i]};color:${darkText[cs[i]]?'#17133f':'#fff'};box-shadow:0 6px 0 rgba(0,0,0,.28);transform:rotate(-1.5deg)">${ls[i]}</div>`:'')
  ).join('');
}
if(t==='copertina'){
  const c=P.get('c')||'mi', notes=['do','re','mi','fa','sol','la','si'], img=P.get('img');
  R.innerHTML=`<div class="navy"></div><div class="cop">
   <div class="sito">musicascuole.it</div>
   <div class="bar" style="background:${C[c]}"></div>
   ${P.get('l').split('|').map(x=>`<div class="t">${x}</div>`).join('')}
   ${P.get('s')?`<div class="st">${P.get('s')}</div>`:''}
   ${img?`<div class="tel"><img src="${img}" style="aspect-ratio:9/${(16*(+P.get('r')||1)).toFixed(2)}"></div>`:
     `<div class="pills">${notes.map(n=>`<div class="pill" style="background:${C[n]};color:${darkText[n]?'#17133f':'#fff'}">${n}</div>`).join('')}</div>`}
  </div>`;
  const ts=[...R.querySelectorAll('.cop .t')]; let fs=118;
  while(ts.some(e=>e.scrollWidth>920)&&fs>60){fs-=4;ts.forEach(e=>e.style.fontSize=fs+'px')}
}
</script></body></html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solfeggio — musicascuole.it</title>
<meta name="description" content="Solfeggio: leggere ritmi e note a tempo, parlando e cantando.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  PAGINA SOLFEGGIO — per attivare una sezione: scrivi il suo indirizzo in "url" nell'elenco VOCI qui sotto.
-->
<link rel="stylesheet" href="fonts/caratteri.css">
<link rel="stylesheet" href="comune.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: #EAF2FF; -webkit-font-smoothing: antialiased;
    background: #0f172a; overflow-x: hidden; position: relative; }
  .casetta { position: fixed; top: calc(12 * var(--u)); left: calc(12 * var(--u)); z-index: 40; width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: 50%; display: grid; place-items: center;
    background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.18); text-decoration: none; font-size: calc(20 * var(--u)); }
  header { position: relative; z-index: 1; text-align: center; padding: calc(26 * var(--u)) calc(20 * var(--u)) calc(14 * var(--u)); }
  h1 { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: calc(25 * var(--u)); margin: 0 0 calc(6 * var(--u)); letter-spacing: -0.015em; }
  header p { font-size: calc(13 * var(--u)); color: #9FB3CE; margin: 0 auto; max-width: calc(460 * var(--u)); line-height: 1.45; }
  main { position: relative; z-index: 1; max-width: calc(1100 * var(--u)); margin: 0 auto; padding: calc(8 * var(--u)) calc(20 * var(--u)) calc(30 * var(--u)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(230 * var(--u)), 1fr)); gap: calc(12 * var(--u)); }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: calc(9 * var(--u)); } main { padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(24 * var(--u)); } header { padding-top: calc(64 * var(--u)); } }
  .card { --accent: #E21C48; position: relative; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-top: 2px solid var(--accent);
    border-radius: calc(12 * var(--u)); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
  a.card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.06); border-color: color-mix(in srgb, var(--accent) 55%, transparent); border-top-color: var(--accent); }
  .card .foto { aspect-ratio: 16 / 7; background: rgba(226,28,72,0.08); display: grid; place-items: center; font-size: calc(34 * var(--u)); }
  .card .foto svg { width: calc(54 * var(--u)); height: calc(54 * var(--u)); }
  h3.gruppo { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: calc(12 * var(--u)); letter-spacing: .08em; text-transform: uppercase; color: #cbd5e1; margin: calc(22 * var(--u)) 0 calc(10 * var(--u)); padding-left: calc(10 * var(--u)); border-left: 3px solid #E21C48; }
  .card .testo { padding: calc(10 * var(--u)) calc(12 * var(--u)) calc(12 * var(--u)); }
  .card .date { font-size: calc(10 * var(--u)); font-weight: 800; letter-spacing: .06em; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: calc(2 * var(--u)) calc(8 * var(--u)); border-radius: calc(999 * var(--u)); display: inline-block; }
  .card h2 { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: calc(15 * var(--u)); margin: calc(5 * var(--u)) 0 calc(2 * var(--u)); }
  .card p { font-size: calc(11.5 * var(--u)); color: #9FB3CE; margin: 0; line-height: 1.4; }
  .card.presto { border-style: dashed; background: transparent; }
  .card.presto .foto { background: rgba(255,255,255,0.03); color: rgba(234,242,255,0.35); }
  .card.presto h2 { color: #8EA3C0; }
  .card.presto .date { color: #7F93B2; background: rgba(255,255,255,0.06); }
  footer.piede { position: relative; z-index: 1; text-align: center; font-size: calc(13 * var(--u)); color: #9FB3CE; padding: calc(12 * var(--u)) calc(12 * var(--u)) calc(24 * var(--u)); }

  /* schermi larghi: tre schede per riga, senza colonna vuota a destra */
  main { max-width: calc(1180 * var(--u)); }
  @media (min-width: 821px) { .grid { grid-template-columns: repeat(3, 1fr); } .card .foto { aspect-ratio: auto; height: calc(130 * var(--u)); } }
  /* LIM e schermi touch: l'effetto "passaggio del mouse" non resta attaccato dopo il tocco;
     quando si preme, la scheda si abbassa appena (risposta immediata al dito) */
  @media (hover: none) {
    .card:hover, .featured-card:hover, .site-home-button:hover, .casetta:hover { transform: none; }
  }
  .card:active, .featured-card:active, .site-home-button:active, .casetta:active { transform: scale(0.98); transition-duration: 0.1s; }
  .card.empty:active, .card.presto:active { transform: none; }
  @media (prefers-reduced-motion: reduce) { .card:active, .featured-card:active { transform: none; } }
</style>
</head>
<body>
<a class="casetta" href="index.html" aria-label="Torna al sito" title="Torna al sito">🏠</a>
<header>
  <h1>Solfeggio</h1>
  <p>Leggere a tempo: prima il ritmo, poi le note, parlando e cantando.</p>
</header>
<main><div class="grid" id="grid"></div><h3 class="gruppo">Già sul sito</h3><div class="grid" id="grid2"></div></main>
<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>
<script>
  const ico = id => `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#${id}"/></svg>`;
  const VOCI = [
    { titolo: "Lettura ritmica", desc: "Ritmi da leggere a tempo, con il metronomo e la base.", icona: "ic-figure-ritmiche" },
    { titolo: "Solfeggio parlato", desc: "Le prime 100 lezioni del Bona: metronomo con suddivisioni, conteggio e schede da stampare.", icona: "ic-leggi-nota", url: "solfeggio-parlato.html" },
    { titolo: "Solfeggio cantato", desc: "Melodie da intonare insieme, con il pianoforte che accompagna.", icona: "ic-recita", url: "solfeggio-cantato.html" }
  ];
  const GIA = [
    { titolo: "Imita il ritmo", desc: "Ascolta uno schema ritmico e riproducilo.", icona: "ic-imita-ritmo", url: "imita-il-ritmo.html" },
    { titolo: "Dettato ritmico", desc: "Ascolta il ritmo e trascrivilo sul rigo.", icona: "ic-dettato-ritmico", url: "dettato-ritmico.html" },
    { titolo: "Dettato melodico", desc: "Ascolta la melodia e scrivila sul pentagramma.", icona: "ic-dettato-melodico", url: "dettato-melodico.html" }
  ];
  function riempi(id, voci) {
    const g = document.getElementById(id);
    voci.forEach(e => {
      const el = document.createElement(e.url ? "a" : "div");
      el.className = "card" + (e.url ? "" : " presto");
      if (e.url) el.href = e.url;
      el.innerHTML = `<div class="foto">${ico(e.icona)}</div>
        <div class="testo">${e.url ? "" : '<span class="date">presto</span>'}<h2>${e.titolo}</h2><p>${e.desc}</p></div>`;
      g.appendChild(el);
    });
  }
  riempi("grid", VOCI); riempi("grid2", GIA);
</script>
</body>
</html>

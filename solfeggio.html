<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solfeggio — musicascuole.it</title>
<meta name="description" content="Solfeggio: leggere ritmi e note a tempo, parlando e cantando.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  PAGINA SOLFEGGIO — per attivare una sezione: scrivi il suo indirizzo in "url" nell'elenco VOCI qui sotto.
-->
<link rel="stylesheet" href="comune.css">
<link rel="stylesheet" href="sito.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="freccia" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="barra-alta contenitore">
  <a class="casa" href="index.html" aria-label="Torna alla pagina principale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>musicascuole.it</a>
</div>

<header class="contenitore">
  <div class="lamella-titolo" style="--col: var(--do);">
    <span class="tasto"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-solfeggio"/></svg></span>
    <div><h1>Solfeggio</h1><p>Leggere a tempo: prima il ritmo, poi le note, parlando e cantando.</p></div>
  </div>
</header>

<main class="contenitore">
  <section class="sezione" aria-label="Solfeggio">
    <ul class="elenco" id="grid"></ul>
  </section>
  <section class="sezione" aria-labelledby="t-gia">
    <div class="sezione-testa"><h2 id="t-gia">Già sul sito</h2></div>
    <ul class="elenco" id="grid2"></ul>
  </section>
</main>

<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>

<script>
  const ico = id => `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#${id}"/></svg>`;
  const VOCI = [
    { titolo: "Lettura ritmica", desc: "Ritmi da leggere a tempo, con il metronomo e la base.", icona: "ic-figure-ritmiche" },
    { titolo: "Solfeggio parlato", desc: "Le prime 100 lezioni del Bona: metronomo con suddivisioni, conteggio e schede da stampare.", icona: "ic-leggi-nota", url: "solfeggio-parlato.html" },
    { titolo: "Solfeggio cantato", desc: "Melodie da intonare insieme, con il pianoforte che accompagna.", icona: "ic-recita", url: "solfeggio-cantato.html" }
  ];
  const GIA = [
    { titolo: "Imita il ritmo", desc: "Ascolta uno schema ritmico e riproducilo.", icona: "ic-imita-ritmo", url: "imita-il-ritmo.html" },
    { titolo: "Dettato ritmico", desc: "Ascolta il ritmo e trascrivilo sul rigo.", icona: "ic-dettato-ritmico", url: "dettato-ritmico.html" },
    { titolo: "Dettato melodico", desc: "Ascolta la melodia e scrivila sul pentagramma.", icona: "ic-dettato-melodico", url: "dettato-melodico.html" }
  ];
  const FRECCIA = '<svg class="freccia" aria-hidden="true"><use href="#freccia"/></svg>';
  /* le voci senza "url" compaiono spente, con la scritta "presto" */
  function riempi(id, voci) {
    const g = document.getElementById(id);
    voci.forEach(e => {
      const li = document.createElement('li');
      li.innerHTML = e.url
        ? `<a class="voce" href="${e.url}"><span class="tasto">${ico(e.icona)}</span><span class="testo"><h3>${e.titolo}</h3><p>${e.desc}</p></span>${FRECCIA}</a>`
        : `<div class="voce presto"><span class="tasto">${ico(e.icona)}</span><span class="testo"><h3>${e.titolo}<span class="presto-etichetta">presto</span></h3><p>${e.desc}</p></span></div>`;
      g.appendChild(li);
    });
  }
  riempi("grid", VOCI); riempi("grid2", GIA);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solfeggio — Musica Peyron</title>
<meta name="description" content="Solfeggio: leggere ritmi e note a tempo, parlando e cantando.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  PAGINA SOLFEGGIO — per attivare una sezione: scrivi il suo indirizzo in "url" nell'elenco VOCI qui sotto.
-->
<link rel="stylesheet" href="fonts/caratteri.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: #EAF2FF; -webkit-font-smoothing: antialiased;
    background: #0f172a; overflow-x: hidden; position: relative; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 50% 0%, #3730a3 0%, transparent 45%), linear-gradient(135deg, #0f172a, #1e1b4b); }
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 3px 3px; }
  .casetta { position: fixed; top: 12px; left: 12px; z-index: 40; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.18); text-decoration: none; font-size: 20px; }
  header { position: relative; z-index: 1; text-align: center; padding: 26px 20px 14px; }
  h1 { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 25px; margin: 0 0 6px; letter-spacing: -0.015em; }
  header p { font-size: 13px; color: #9FB3CE; margin: 0 auto; max-width: 460px; line-height: 1.45; }
  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 8px 20px 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 9px; } main { padding: 6px 12px 24px; } header { padding-top: 64px; } }
  .card { --accent: #E21C48; position: relative; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-top: 2px solid var(--accent);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
  a.card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.06); border-color: color-mix(in srgb, var(--accent) 55%, transparent); border-top-color: var(--accent); }
  .card .foto { aspect-ratio: 16 / 7; background: rgba(226,28,72,0.08); display: grid; place-items: center; font-size: 34px; }
  .card .foto svg { width: 54px; height: 54px; }
  h3.gruppo { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #cbd5e1; margin: 22px 0 10px; padding-left: 10px; border-left: 3px solid #E21C48; }
  .card .testo { padding: 10px 12px 12px; }
  .card .date { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .card h2 { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; margin: 5px 0 2px; }
  .card p { font-size: 11.5px; color: #9FB3CE; margin: 0; line-height: 1.4; }
  .card.presto { border-style: dashed; background: transparent; }
  .card.presto .foto { background: rgba(255,255,255,0.03); color: rgba(234,242,255,0.35); }
  .card.presto h2 { color: #8EA3C0; }
  .card.presto .date { color: #7F93B2; background: rgba(255,255,255,0.06); }
  footer.piede { position: relative; z-index: 1; text-align: center; font-size: 13px; color: #9FB3CE; padding: 12px 12px 24px; }
  footer.piede a { color: #7DD3FC; }
</style>
</head>
<body>
<a class="casetta" href="index.html" aria-label="Torna al sito" title="Torna al sito">🏠</a>
<header>
  <h1>Solfeggio</h1>
  <p>Leggere a tempo: prima il ritmo, poi le note, parlando e cantando.</p>
</header>
<main><div class="grid" id="grid"></div><h3 class="gruppo">Già sul sito</h3><div class="grid" id="grid2"></div></main>
<footer class="piede">Cristiano Arata · Musica Peyron — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>
<script>
  const ico = id => `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#${id}"/></svg>`;
  const VOCI = [
    { titolo: "Lettura ritmica", desc: "Ritmi da leggere a tempo, con il metronomo e la base.", icona: "ic-figure-ritmiche" },
    { titolo: "Solfeggio parlato", desc: "Le prime 80 lezioni del Bona: metronomo con suddivisioni, conteggio e schede da stampare.", icona: "ic-leggi-nota", url: "solfeggio-parlato.html" },
    { titolo: "Solfeggio cantato", desc: "Brevi melodie da intonare.", icona: "ic-recita" }
  ];
  const GIA = [
    { titolo: "Imita il ritmo", desc: "Ascolta uno schema ritmico e riproducilo.", icona: "ic-imita-ritmo", url: "imita-il-ritmo.html" },
    { titolo: "Dettato ritmico", desc: "Ascolta il ritmo e trascrivilo sul rigo.", icona: "ic-dettato-ritmico", url: "dettato-ritmico.html" },
    { titolo: "Dettato melodico", desc: "Ascolta la melodia e scrivila sul pentagramma.", icona: "ic-dettato-melodico", url: "dettato-melodico.html" }
  ];
  function riempi(id, voci) {
    const g = document.getElementById(id);
    voci.forEach(e => {
      const el = document.createElement(e.url ? "a" : "div");
      el.className = "card" + (e.url ? "" : " presto");
      if (e.url) el.href = e.url;
      el.innerHTML = `<div class="foto">${ico(e.icona)}</div>
        <div class="testo">${e.url ? "" : '<span class="date">presto</span>'}<h2>${e.titolo}</h2><p>${e.desc}</p></div>`;
      g.appendChild(el);
    });
  }
  riempi("grid", VOCI); riempi("grid2", GIA);
</script>
</body>
</html>

  i bambini la seguono con il dito in aria. Niente spiegazioni.
  La musica la suona la pagina (pianoforte campionato + timbri sintetici), così è sempre a tempo.

<script>
(function () {
  "use strict";

  /* =====================================================================
     LE TAPPE
     nota: "nome+ottava:battiti[:segni]"   es. "sol4:2", "fa#4:1", "-:1" = silenzio
       segni: s = staccato (puntino), p / pp = piano, f = forte, F = fortissimo (con accordo)
     forma della frase: linee | punti | misto (s = puntino, il resto linea) | curva | zigzag | riccioli
     strumento: flauto | archi | piano | campanella | pizzicato

      { forma: "linee", note: "la4:2 -:2 la4:2 -:2 la4:6 -:2", accordi: "F Dm F F" } ] },

      { forma: "punti", note: "mi5:1 mi5:1 mi5:1 -:1 mi5:1 mi5:1 mi5:1 -:1 mi5:1 -:1 mi5:1 -:1 mi5:1 mi5:1 mi5:1 -:1", accordi: "C Am C Am" },
      { forma: "punti", note: "sol5:1 -:1 sol5:1 -:1 sol5:0.5 sol5:0.5 sol5:1 -:2 sol5:1 sol5:1 sol5:1 sol5:1 sol5:1 -:3", accordi: "C Em C G" } ] },
    { nome: "Lunghi e corti", icona: "bicicletta", bpm: 88, metro: 4, strumento: "flauto", accompagna: "lunghi", frasi: [
      { forma: "misto", note: "do5:4 do5:1:s do5:1:s do5:1:s -:1 do5:4 do5:1:s do5:1:s do5:2:s", accordi: "C F C C" },
      { forma: "misto", note: "sol4:1:s sol4:1:s sol4:2 sol4:1:s sol4:1:s sol4:2 sol4:1:s sol4:1:s sol4:1:s sol4:1:s sol4:4", accordi: "C Em C C" } ] },
    { nome: "Sale e scende", icona: "razzo", bpm: 92, metro: 4, strumento: "flauto", accompagna: "lunghi", frasi: [
      { forma: "curva", note: "do4:1 re4:1 mi4:1 fa4:1 sol4:1 la4:1 si4:1 do5:1 do5:1 si4:1 la4:1 sol4:1 fa4:1 mi4:1 re4:1 do4:1", accordi: "C G C C" },
      { forma: "curva", note: "do4:2 mi4:2 sol4:2 do5:2 sol4:2 mi4:2 do4:4", accordi: "C C C C" } ] },
    { nome: "Onde", icona: "pesce", bpm: 84, metro: 4, strumento: "archi", accompagna: "lunghi", frasi: [
      { forma: "curva", note: "sol4:2 mi4:2 sol4:2 mi4:2 sol4:2 mi4:2 sol4:4", accordi: "C C C C" },
      { forma: "curva", note: "sol4:1 la4:1 sol4:1 mi4:1 sol4:1 la4:1 sol4:1 mi4:1 sol4:1 la4:1 sol4:1 mi4:1 sol4:2 mi4:2", accordi: "C F C C" },
      { forma: "curva", note: "do4:2 do5:2 do4:2 do5:2 mi4:2 sol4:2 do4:4", accordi: "C C C C" } ] },
    { nome: "Zig-zag", icona: "temporale", bpm: 100, metro: 4, strumento: "piano", accompagna: "marcia", frasi: [
      { forma: "zigzag", note: "do4:1 sol4:1 do4:1 sol4:1 do4:1 sol4:1 do4:1 sol4:1 mi4:1 do5:1 mi4:1 do5:1 mi4:1 do5:1 mi4:2", accordi: "C C C C" },
      { forma: "zigzag", note: "sol4:0.5 re5:0.5 sol4:0.5 re5:0.5 sol4:0.5 re5:0.5 sol4:0.5 re5:0.5 sol4:0.5 re5:0.5 sol4:0.5 re5:0.5 sol4:0.5 re5:0.5 sol4:1 do4:0.5 do5:0.5 do4:0.5 do5:0.5 do4:0.5 do5:0.5 do4:0.5 do5:0.5 do4:0.5 do5:0.5 do4:0.5 do5:0.5 do4:2", accordi: "G G C C" } ] },
    { nome: "Riccioli", icona: "lumaca", bpm: 138, metro: 3, strumento: "flauto", accompagna: "valzer", frasi: [
      { forma: "riccioli", note: "mi4:3 sol4:3 mi4:3 sol4:3 do5:3 sol4:3 mi4:6", accordi: "C Em C Em Am C C C" },
      { forma: "riccioli", note: "sol4:3 la4:3 sol4:3 mi4:3 sol4:3 la4:3 sol4:6", accordi: "C F C C C F C C" } ] },
    { nome: "Forte e piano", icona: "leone", bpm: 90, metro: 4, strumento: "campanella", accompagna: "lunghi", frasi: [
      { forma: "punti", note: "do5:1:f do5:1:f do5:1:f -:1 do5:1:p do5:1:p do5:1:p -:1 do5:1:f do5:1:f do5:1:f -:1 do5:1:p do5:1:p do5:1:p -:1", accordi: "C C C C" },
      { forma: "linee", strumento: "archi", note: "sol4:4:f sol4:4:p sol4:4:f sol4:4:p", accordi: "C C C C" } ] },
    { nome: "Inno alla gioia", autore: "Beethoven", icona: "festa", bpm: 104, metro: 4, strumento: "archi", accompagna: "lunghi", grande: true, frasi: [
      { forma: "curva", note: "mi4:1 mi4:1 fa4:1 sol4:1 sol4:1 fa4:1 mi4:1 re4:1 do4:1 do4:1 re4:1 mi4:1 mi4:1.5 re4:0.5 re4:2", accordi: "C G C G" },
      { forma: "curva", note: "mi4:1 mi4:1 fa4:1 sol4:1 sol4:1 fa4:1 mi4:1 re4:1 do4:1 do4:1 re4:1 mi4:1 re4:1.5 do4:0.5 do4:2", accordi: "C G C C" } ] },
    { nome: "La sorpresa", autore: "Haydn", icona: "dorme", bpm: 100, metro: 4, strumento: "pizzicato", accompagna: "lunghi", grande: true, frasi: [
      { forma: "punti", note: "do4:1:p do4:1:p mi4:1:p mi4:1:p sol4:1:p sol4:1:p mi4:2:p fa4:1:p fa4:1:p re4:1:p re4:1:p si3:1:p si3:1:p sol3:2:p", accordi: "C C G G" },
      { forma: "punti", note: "do4:1:pp do4:1:pp mi4:1:pp mi4:1:pp sol4:1:pp sol4:1:pp mi4:2:pp fa#4:1:pp fa#4:1:pp la4:1:pp la4:1:pp sol4:2:pp -:1 sol4:1:F", accordi: "C C D7 G" } ] },
    { nome: "Il re della montagna", autore: "Grieg", icona: "orso", metro: 4, strumento: "pizzicato", accompagna: "pedale", basso: "si2", grande: true, frasi: [
      { forma: "punti", bpm: 104, note: "si3:1:pp do#4:1:pp re4:1:pp mi4:1:pp fa#4:1:pp re4:1:pp fa#4:2:pp mi#4:1:pp do#4:1:pp mi#4:2:pp mi4:1:pp do4:1:pp mi4:2:pp si3:1:pp do#4:1:pp re4:1:pp mi4:1:pp fa#4:1:pp re4:1:pp fa#4:1:pp si4:1:pp la4:1:pp fa#4:1:pp re4:1:pp fa#4:1:pp la4:4:pp" },
      { forma: "punti", bpm: 124, note: "si3:1 do#4:1 re4:1 mi4:1 fa#4:1 re4:1 fa#4:2 mi#4:1 do#4:1 mi#4:2 mi4:1 do4:1 mi4:2 si3:1 do#4:1 re4:1 mi4:1 fa#4:1 re4:1 fa#4:1 si4:1 la4:1 fa#4:1 re4:1 fa#4:1 la4:4" },
      { forma: "punti", bpm: 148, note: "si3:1:f do#4:1:f re4:1:f mi4:1:f fa#4:1:f re4:1:f fa#4:2:f mi#4:1:f do#4:1:f mi#4:2:f mi4:1:f do4:1:f mi4:2:f si3:1:f do#4:1:f re4:1:f mi4:1:f fa#4:1:f re4:1:f fa#4:1:f si4:1:f la4:1:f fa#4:1:f re4:1:f fa#4:1:f si4:4:F" } ] }
  ];

  const COLORI_LINEA = ["#FF4D6D", "#FFB020", "#2EE6D6", "#BED958", "#A78BFA", "#FF6EC7", "#FFF428"];
  const COLORI_TAPPA = ["#E21C48", "#F99D1C", "#d9b800", "#8fb83a", "#009C95", "#5E50A1", "#CF3E96"];
  const NOTE = { do: 0, re: 2, mi: 4, fa: 5, sol: 7, la: 9, si: 11 };
  const GRADO = { do: 0, re: 1, mi: 2, fa: 3, sol: 4, la: 5, si: 6 };
  const DIN = { pp: 0.4, p: 0.6, "": 1, f: 1.6, F: 2.4 };
  const $ = id => document.getElementById(id);

  /* ---------- lettura delle note ---------- */
  function leggiNote(testo) {
    let t = 0;
    return testo.trim().split(/\s+/).map(tok => {
      const [n, d, segni = ""] = tok.split(":");
      const dur = +d, ev = { t0: t, t1: t + dur, dur };
      t += dur;
      if (n === "-") { ev.pausa = true; return ev; }
      const m = /^(do|re|mi|fa|sol|la|si)(#|b)?(\d)$/.exec(n);
      ev.midi = 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
      ev.grado = +m[3] * 7 + GRADO[m[1]];
      ev.stacc = segni.includes("s");
      ev.din = segni.includes("F") ? "F" : segni.includes("pp") ? "pp" : segni.includes("p") ? "p" : segni.includes("f") ? "f" : "";
      return ev;
    });
  }
  /* prepara una tappa: tempi in secondi, frase dopo frase */
  function prepara(tp, lento) {
    let tAss = 0;
    const frasi = tp.frasi.map((f, i) => {
      const bpm = (f.bpm || tp.bpm) * (lento ? 0.75 : 1), sb = 60 / bpm;
      const note = leggiNote(f.note);
      const battiti = note.length ? note[note.length - 1].t1 : 0;
      const fr = { i, metro: tp.metro, forma: f.forma, strumento: f.strumento || tp.strumento, note, battiti, sb, inizio: tAss, durata: battiti * sb,
        accordi: (f.accordi || "").split(/\s+/).filter(Boolean), colore: COLORI_LINEA[i % COLORI_LINEA.length] };
      tAss += fr.durata;
      return fr;
    });
    return { frasi, durata: tAss, metro: tp.metro, bpm0: (tp.frasi[0].bpm || tp.bpm) * (lento ? 0.75 : 1) };
  }

  /* =====================================================================
     AUDIO: pianoforte campionato (Salamander, CC BY 3.0, gli stessi suoni dei giochi) + timbri sintetici
     ===================================================================== */
  let ctx = null, uscita = null, sorgenti = [];
  function audio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      uscita = ctx.createGain(); uscita.gain.value = 0.8;
      const comp = ctx.createDynamicsCompressor(); uscita.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const PIANO = [["C2", 36], ["Ds2", 39], ["Fs2", 42], ["A2", 45], ["C3", 48], ["Ds3", 51], ["Fs3", 54], ["A3", 57], ["C4", 60], ["Ds4", 63],
    ["Fs4", 66], ["A4", 69], ["C5", 72], ["Ds5", 75], ["Fs5", 78], ["A5", 81], ["C6", 84]].map(([n, m]) => ({ midi: m, url: "media/suoni/pianoforte/" + n + ".mp3" }));
  let pianoBuf = null, pianoProm = null;
  function caricaPiano() {
    if (pianoProm) return pianoProm;
    const c = audio();
    pianoProm = Promise.all(PIANO.map(s => fetch(s.url).then(r => r.arrayBuffer()).then(d => new Promise(ok => c.decodeAudioData(d, buf => {
      const ch = buf.getChannelData(0); let picco = 0; for (let i = 0; i < ch.length; i++) picco = Math.max(picco, Math.abs(ch[i]));
      let i = 0; while (i < ch.length && Math.abs(ch[i]) < picco * 0.03) i++;
      ok({ midi: s.midi, buf, off: Math.max(0, i / buf.sampleRate - 0.002) });
    }, () => ok(null)))).catch(() => null))).then(l => (pianoBuf = l.filter(Boolean)));
    return pianoProm;
  }
  function tieni(src) { sorgenti.push(src); src.onended = () => { const i = sorgenti.indexOf(src); if (i >= 0) sorgenti.splice(i, 1); }; }
  function piano(m, t, dur, vol) {
    if (!pianoBuf || !pianoBuf.length) return sintetico("campanella", m, t, dur, vol * 0.8);
    let b = pianoBuf[0]; pianoBuf.forEach(s => { if (Math.abs(s.midi - m) < Math.abs(b.midi - m)) b = s; });
    const src = ctx.createBufferSource(); src.buffer = b.buf; src.playbackRate.value = Math.pow(2, (m - b.midi) / 12);
    const g = ctx.createGain(), fine = t + Math.max(0.15, dur);
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, fine); g.gain.setTargetAtTime(0.0001, fine, 0.1);
    src.connect(g); g.connect(uscita); src.start(t, b.off); src.stop(fine + 0.6); tieni(src);

    const primoGrande = TAPPE.findIndex(t => t.grande);
    if (primoGrande > 0) { const [x, y] = POSTI[primoGrande]; s += `<g transform="translate(${x + 95} ${y - 95})"><rect x="-92" y="-22" width="184" height="40" rx="20" fill="#5E50A1"/><text y="7" font-size="21" fill="#fff">🎻 Grandi musiche</text></g>`; }
    TAPPE.forEach((t, i) => {
      const [x, y] = POSTI[i], col = COLORI_TAPPA[i % 7], fatta = fatte.includes(i);
      s += `<g class="tappa" data-i="${i}" tabindex="0" role="button" aria-label="Tappa ${i + 1}: ${t.nome}" transform="translate(${x} ${y})">
        <circle class="disco" r="66" fill="${col}" stroke="#fff" stroke-width="7"/>
        <image href="primaria/img/col/${t.icona}.svg" x="-46" y="-50" width="92" height="92"/>
        <circle cx="-50" cy="-50" r="23" fill="#fff"/><text x="-50" y="-41" font-size="25" fill="${col}">${i + 1}</text>
        ${fatta ? `<text x="52" y="-40" font-size="34">⭐</text>` : ""}
        <rect x="-110" y="76" width="220" height="40" rx="20" fill="rgba(15,23,42,0.82)"/>
        <text y="104" font-size="${t.nome.length > 15 ? 20 : 23}" fill="#fff">${t.nome}</text>
      </g>`;
    });
    s += `</g>`;
    svg.innerHTML = s;
    svg.querySelectorAll(".tappa").forEach(g => {
      const vai = () => apriTappa(+g.dataset.i);
      g.addEventListener("click", vai);
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); vai(); } });
    });
  }

  /* titolo colorato, lettera per lettera */
  const h1 = $("titoloColorato"); h1.innerHTML = [...h1.textContent].map(ch => ch === " " ? " " : `<span>${ch}</span>`).join("");

  /* avvio: #3 apre direttamente la tappa 3 */
  function daIndirizzo() { const n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= TAPPE.length) apriTappa(n - 1); else apriPercorso(); }
  window.addEventListener("hashchange", daIndirizzo);
  daIndirizzo();
})();
</script>
</body>
</html>

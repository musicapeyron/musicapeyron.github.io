<!--
  ============================================================
  COSTRUTTORE DI BATTUTE
  Si costruiscono battute complete con i mattoncini delle figure.
  Quattro tempi (4/4, 3/4, 2/4, 6/8), dieci livelli ciascuno:
  dal 7 crome e pause di croma sono limitate, dall'8 i mattoncini
  sono in bianco e nero, dal 9 nella tavolozza hanno tutti la stessa
  misura, al 10 la battuta non ha suddivisioni interne.
  Verifica: livello 10 con cronometro; ogni battuta identica a una
  precedente è un errore (voto: 10 meno mezzo punto ogni due errori).
  La versione precedente è in costruttore-di-battute-originale.html.
  ============================================================
-->
<title>Costruttore di Battute — musicascuole.it</title>
<meta name="description" content="Costruttore di battute: completa le battute con le figure ritmiche giuste per il tempo indicato. Esercizio interattivo di teoria musicale.">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Inter', 'Manrope', Arial, sans-serif; color: #EAF2FF; background: #0f172a; overflow-x: hidden;
    -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  .casetta { position: fixed; top: 12px; left: 12px; z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.18); text-decoration: none; font-size: 20px; backdrop-filter: blur(6px); }

  /* ---------- barra in alto ---------- */
  .barra { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px 66px; max-width: 1240px; margin: 0 auto; }
  .barra h1 { font-family: 'Manrope', sans-serif; font-size: 18px; margin: 0 auto 0 0; white-space: nowrap; }
  .chip { font-weight: 700; font-size: 13px; color: #EAF2FF; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; padding: 8px 13px; cursor: pointer; white-space: nowrap; }
  .chip:hover { background: rgba(255,255,255,0.13); }
  .chip.verifica { background: #F99D1C; color: #1F2430; border-color: #F99D1C; }
  .chip.verifica.attiva { background: transparent; color: #F99D1C; }

  /* ---------- stato: avanzamento, limiti, cronometro ---------- */
  .stato { display: flex; align-items: center; gap: 10px; padding: 0 14px 10px; flex-wrap: wrap; max-width: 1240px; margin: 0 auto; }
  .avanz { flex: 1; min-width: 180px; }
  .avanz-testo { font-size: 13px; font-weight: 700; color: #9FB3CE; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .avanz-barra { height: 7px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .avanz-barra div { height: 100%; width: 0; background: linear-gradient(90deg, #009C95, #BED958); border-radius: 99px; transition: width .4s; }
  .info { font-size: 12.5px; font-weight: 700; color: #EAF2FF; background: rgba(255,255,255,0.07); border-radius: 999px; padding: 5px 11px; }
  .info.cronometro { color: #F99D1C; font-variant-numeric: tabular-nums; }

  /* ---------- area di gioco ---------- */
  .gioco { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 14px; padding: 0 14px 18px; max-width: 1240px; margin: 0 auto; }
  .scheda { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 16px; }
  .scheda-titolo { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9FB3CE; margin: 0 0 10px; }

  /* la battuta in costruzione */
  .battuta { position: relative; height: 92px; border-radius: 14px; background: rgba(15,23,42,0.55); border: 2px solid rgba(255,255,255,0.14);
    overflow: hidden; touch-action: manipulation; transition: border-color .2s, box-shadow .2s; }
  .battuta .linea { position: absolute; top: 10px; bottom: 10px; width: 0; border-left: 1.5px dashed rgba(255,255,255,0.18); }
  .battuta .linea.forte { border-left: 2px solid rgba(255,255,255,0.3); }
  .battuta .pezzi { position: absolute; inset: 0; display: flex; }
  .battuta.completa { border-color: #BED958; box-shadow: 0 0 0 4px rgba(190,217,88,0.25); }
  .battuta.errore { animation: scuoti .35s; border-color: #E21C48; }
  @keyframes scuoti { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .vuota { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(234,242,255,0.45); font-size: 14px; pointer-events: none; text-align: center; padding: 0 10px; }

  /* mattoncini */
  .mattone { position: relative; height: 100%; border-radius: 10px; display: grid; place-items: center; color: #fff; cursor: pointer;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.18); border: 2px solid rgba(15,23,42,0.6); }
  .mattone svg { width: 34px; height: 46px; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.25)); }
  .battuta .mattone { animation: entra .18s ease-out; }
  @keyframes entra { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .battuta .mattone:hover::after { content: "✕"; position: absolute; top: 4px; right: 6px; font-size: 11px; opacity: .8; }
  .battuta .mattone.suona { filter: brightness(1.35); transform: translateY(-3px); }
  .bianconero .mattone { background: #F1F5F9 !important; color: #1F2430; border-color: #1F2430; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12); }
  .trasparenti .battuta .mattone { background: transparent !important; color: #EAF2FF; border: 2px dashed rgba(255,255,255,0.35); box-shadow: none; }

  /* notazione e azioni */
  .notazione { margin-top: 12px; background: #fff; border-radius: 12px; min-height: 96px; display: grid; place-items: center; padding: 4px 8px; }
  .notazione .spartito { width: 100%; }
  .notazione .segnaposto { color: #64748b; font-size: 13px; }
  .azioni { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .azione { flex: 1; min-width: 96px; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 11px 10px; cursor: pointer;
    color: #EAF2FF; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
  .azione.principale { background: #009C95; border-color: #009C95; color: #fff; }
  .azione:disabled { opacity: .4; cursor: default; }
  .messaggio { min-height: 22px; margin-top: 10px; font-size: 14px; font-weight: 600; text-align: center; }
  .messaggio.ok { color: #BED958; } .messaggio.avviso { color: #F99D1C; } .messaggio.errore { color: #ff6b81; }

  /* battute completate */
  .fatte { margin-top: 14px; }
  .fatte-lista { display: flex; flex-wrap: wrap; gap: 6px; }
  .mini { display: flex; width: 92px; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; position: relative; }
  .mini span { height: 100%; border-right: 1px solid rgba(15,23,42,0.6); }
  .mini .num { position: absolute; left: 3px; top: 1px; font-size: 9px; font-weight: 800; color: #fff; text-shadow: 0 0 2px #000; }
  .mini.lampeggia { animation: lampo .5s 3; }
  @keyframes lampo { 50% { box-shadow: 0 0 0 3px #E21C48; } }
  .mini.attesa { opacity: .35; border-style: dashed; }

  /* tavolozza */
  .tavolozza .elenco { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .pezzo { display: flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 0; cursor: pointer; color: #EAF2FF; text-align: left; }
  .pezzo .mattone { height: 52px; flex: none; }
  .pezzo .nome { font-size: 13px; font-weight: 700; line-height: 1.25; }
  .pezzo .nome small { display: block; color: #9FB3CE; font-weight: 600; }
  .pezzo .resto { margin-left: auto; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.1); border-radius: 99px; padding: 2px 8px; }
  .pezzo:active .mattone { transform: scale(0.95); }
  .pezzo.esaurito { opacity: .35; }

  /* ---------- finestre (avvio, schema, fine livello) ---------- */
  .finestra { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(8,12,30,0.78); backdrop-filter: blur(6px); }
  .finestra.aperta { display: flex; }
  .riquadro { width: min(620px, 100%); max-height: 100%; overflow: auto; background: #1b1f45; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px; padding: 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
  .riquadro h2 { font-family: 'Manrope', sans-serif; margin: 0 0 4px; font-size: 24px; }
  .riquadro p { color: #9FB3CE; margin: 0 0 14px; }
  .scelte { display: grid; gap: 8px; margin: 10px 0 14px; }
  .scelte.tempi { grid-template-columns: repeat(4, 1fr); }
  .scelte.livelli { grid-template-columns: repeat(10, 1fr); }
  .scelta { font-weight: 800; color: #EAF2FF; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 12px 4px; cursor: pointer; font-family: 'Manrope', sans-serif; }
  .scelte.tempi .scelta { font-size: 22px; padding: 14px 4px; }
  .scelte.tempi .scelta small { display: block; font-size: 10.5px; color: #9FB3CE; font-weight: 700; margin-top: 2px; }
  .scelta.attiva { background: #5E50A1; border-color: #a78bfa; }
  .etichetta { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #9FB3CE; text-align: left; }
  .descr-livello { min-height: 20px; font-size: 14px; color: #EAF2FF; margin-bottom: 12px; }
  .interruttore { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; font-size: 14px; margin: 4px 0 16px; }
  .interruttore input { width: 44px; height: 24px; accent-color: #009C95; }
  .pulsanti { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .grande { font-weight: 800; font-size: 15px; border-radius: 12px; padding: 12px 20px; cursor: pointer; border: 0; color: #fff; background: #009C95; }
  .grande.secondario { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); }
  .grande.arancio { background: #F99D1C; color: #1F2430; }
  .schema-barre { display: grid; gap: 8px; margin: 14px 0 18px; text-align: left; }
  .schema-riga { display: flex; align-items: center; gap: 12px; }
  .schema-riga .mattone { height: 40px; flex: none; }
  .schema-riga .mattone svg { width: 26px; height: 36px; }
  .schema-riga span { font-size: 13px; font-weight: 700; }
  .risultato { font-size: 52px; font-weight: 800; font-family: 'Manrope', sans-serif; color: #BED958; margin: 6px 0; }

  /* ---------- telefono e schermi stretti: tavolozza in basso, a portata di pollice ---------- */
  @media (max-width: 899px) {
    .gioco { grid-template-columns: 1fr; padding-bottom: var(--spazio-tavolozza, 150px); }
    .barra { padding-bottom: 14px; }
    .tavolozza { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-radius: 18px 18px 0 0; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(20,24,58,0.96); backdrop-filter: blur(8px); border-bottom: 0; }
    .tavolozza .scheda-titolo { display: none; }
    .tavolozza .elenco { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 8px; }
    .tavolozza .elenco::-webkit-scrollbar { display: none; }
    .pezzo { flex-direction: column; gap: 4px; flex: none; align-items: center; text-align: center; }
    .pezzo .nome { display: none; }
    .pezzo .mattone { height: 46px; }
    .pezzo .mattone svg { width: 26px; height: 36px; }
    .pezzo .nome small { display: none; }
    .pezzo .resto { margin: 0; position: absolute; transform: translate(22px, -6px); }
    .barra h1 { font-size: 15px; }
    .barra .chip { padding: 7px 10px; font-size: 12px; }
    .scelte.livelli { grid-template-columns: repeat(5, 1fr); }
  }
  @media (max-width: 420px) { .barra h1 { display: none; } .barra { padding-left: 64px; } .battuta { height: 78px; } .mattone svg { width: 28px; height: 40px; } }
  /* telefono in orizzontale: tavolozza a destra, compatta */
  @media (max-height: 500px) and (orientation: landscape) {
    .gioco { grid-template-columns: minmax(0, 1fr) 200px; padding-bottom: 12px; }
    .tavolozza { position: static; border-radius: 18px; background: rgba(255,255,255,0.045); max-height: calc(100vh - 110px); overflow: auto; padding: 10px; }
    .tavolozza .elenco { display: grid; grid-template-columns: 1fr; }
    .pezzo { flex-direction: row; } .pezzo .mattone { height: 40px; }
    .battuta { height: 70px; } .notazione { min-height: 70px; } .barra { padding-top: 8px; }
  }

  /* ---------- LIM e PC: tutto in una schermata, senza scorrere ---------- */
  @media (min-width: 900px) and (min-height: 560px) and (max-height: 1000px) {
    .gioco { padding-bottom: 10px; }
    .tavolozza { padding: 12px 14px; }
    .tavolozza .scheda-titolo { margin-bottom: 8px; }
    /* mattoncini alti in base allo spazio (fino a 10 pezzi in colonna) */
    .tavolozza .elenco { gap: 6px; }
    .pezzo .mattone { height: clamp(36px, calc((100vh - 200px) / 10 - 6px), 52px); }
    .pezzo .mattone svg { height: min(46px, 85%); }
    /* battute completate: più colonne, fino a 50 senza scorrere */
    .fatte { margin-top: 8px; }
    .fatte .scheda-titolo { margin-bottom: 6px; }
    .fatte-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 5px; }
    .mini { width: auto; height: 22px; }
    .messaggio { margin-top: 6px; }
    .battuta { height: clamp(72px, calc(100vh - 580px), 92px); }
    /* schema del livello su due colonne */
    #finSchema .riquadro { width: min(980px, 100%); }
    .schema-barre { grid-template-columns: 1fr 1fr; column-gap: 28px; }
  }
  /* coriandoli (come negli altri giochi) */
  #strato-coriandoli { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 200; }
  .confetti-piece { position: absolute; width: 8px; height: 8px; border-radius: 2px; opacity: 1; animation: confettiBurst 0.9s ease-out forwards; }
  @keyframes confettiBurst { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); opacity: 0; } }

  /* ===== risparmio energetico (telefoni): vedi _sviluppo/risparmio_energetico.py ===== */
  .tavolozza { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .casetta { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(15, 23, 42, 0.92); }

  /* ---------- SCHERMI LARGHI (PC e LIM): l'area di gioco ha un'altezza fissa (così non
     cambia mentre si completano le battute), la battuta e i mattoncini sono più grandi,
     poi tutta la pagina si ingrandisce fino a riempire lo schermo (adatta-schermo.js).
     Il telefono non cambia. ---------- */
  @media (min-width: 900px) and (min-height: 560px) {
    #paginaGioco { width: 1260px; margin: 0 auto; }
    .barra, .stato, .gioco { max-width: none; }
    .barra { padding-left: 60px; }
    /* mattoncini su due colonne: così la tavolozza non è più alta dell'area di lavoro */
    .gioco { grid-template-columns: minmax(0, 1fr) 470px; min-height: 600px; padding-bottom: 12px; }
    .tavolozza .elenco { grid-template-columns: 1fr 1fr; column-gap: 18px; row-gap: 12px; }
    /* nome sotto il mattoncino: le lunghezze dei mattoncini (cioè le durate) restano quelle vere */
    .tavolozza .pezzo { flex-direction: column; align-items: flex-start; gap: 4px; }
    .tavolozza .pezzo .resto { position: absolute; right: 0; top: 14px; }
    .tavolozza .pezzo { position: relative; }
    .scheda.lavoro { display: flex; flex-direction: column; }
    .battuta { height: 130px; }
    .battuta .mattone svg { width: 44px; height: 60px; }
    .notazione { min-height: 140px; }
    .azione { font-size: 16px; padding: 14px 10px; }
    .messaggio { font-size: 16px; }
    .pezzo .mattone { height: 52px; }
    .pezzo .mattone svg { height: 46px; }
    .pezzo .nome { font-size: 14px; }
    .fatte { margin-top: auto; }
  }
</style>

<body>
<script src="info-sito.js"></script>
<div id="strato-coriandoli" aria-hidden="true"></div>
<a class="casetta" href="index.html" aria-label="Torna al sito" title="Torna al sito">🏠</a>

<div id="paginaGioco">
<header class="barra">
  <h1>Costruttore di battute</h1>
  <button class="chip" id="chipTempo" title="Cambia tempo o livello">4/4</button>
  <button class="chip" id="chipLivello" title="Cambia livello">Livello 1</button>
  <button class="chip verifica" id="chipVerifica" title="Verifica: livello 10 con cronometro e voto">Verifica</button>
</header>

<div class="stato">
  <div class="avanz">
    <div class="avanz-testo"><span id="testoBattuta">Battuta 1 di 6</span><span id="testoLivello"></span></div>
    <div class="avanz-barra"><div id="barraAvanz"></div></div>
  </div>
  <span class="info" id="infoLimiti" hidden></span>
  <span class="info cronometro" id="cronometro" hidden>0:00</span>
</div>

<main class="gioco" id="gioco">
  <section class="scheda lavoro">
    <div class="scheda-titolo" id="titoloBattuta">Battuta 1</div>
    <div class="battuta" id="battuta" aria-label="Battuta in costruzione"></div>
    <div class="notazione" id="notazione"></div>
    <div class="azioni">
      <button class="azione principale" id="btnAscolta">▶ Ascolta</button>
      <button class="azione" id="btnAnnulla">↶ Annulla</button>
      <button class="azione" id="btnSvuota">Svuota</button>
    </div>
    <div class="messaggio" id="messaggio"></div>
    <div class="fatte">
      <div class="scheda-titolo">Battute completate · tocca per ascoltare</div>
      <div class="fatte-lista" id="fatte"></div>
    </div>
  </section>
  <aside class="scheda tavolozza">
    <div class="scheda-titolo">Mattoncini · tocca per aggiungere</div>
    <div class="elenco" id="tavolozza"></div>
  </aside>
</main>
</div>

<div class="finestra" id="finAvvio"><div class="riquadro">
  <h2>Costruttore di battute</h2>
  <p>Costruisci battute complete con i mattoncini delle figure.</p>
  <div class="etichetta">Tempo</div>
  <div class="scelte tempi" id="sceltaTempo"></div>
  <div class="etichetta">Livello</div>
  <div class="scelte livelli" id="sceltaLivello"></div>
  <div class="descr-livello" id="descrLivello"></div>
  <label class="interruttore"><input type="checkbox" id="perIdentiche" checked> Permetti battute identiche</label>
  <div class="pulsanti">
    <button class="grande" id="btnInizia">Inizia</button>
    <button class="grande arancio" id="btnVerifica">Verifica · livello 10</button>
  </div>
</div></div>

<div class="finestra" id="finSchema"><div class="riquadro">
  <h2 id="schemaTitolo">Livello 1</h2>
  <p id="schemaDescr"></p>
  <div class="schema-barre" id="schemaBarre"></div>
  <button class="grande" id="btnSchema">Comincia</button>
</div></div>

<div class="finestra" id="finFine"><div class="riquadro">
  <h2 id="fineTitolo">Livello completato!</h2>
  <div class="risultato" id="fineRisultato"></div>
  <p id="fineDescr"></p>
  <div class="pulsanti" id="finePulsanti"></div>

/* ===================== stato del gioco ===================== */
const TEMPI = { "4/4": 4, "3/4": 3, "2/4": 2, "6/8": 3 };            // durata della battuta in semiminime
const NOMI_TEMPO = { "4/4": "quattro quarti", "3/4": "tre quarti", "2/4": "due quarti", "6/8": "tempo composto" };
const LIMITATI = { croma: 25, pausacroma: 25 };                        // dal livello 7
const PLURALI = { croma: "crome", pausacroma: "pause di croma" };
const S = { tempo: "4/4", livello: 1, identiche: true, verifica: false, battute: [], corrente: 0, uso: {}, inizio: null, errori: 0, timer: null, bloccato: false };
const $ = id => document.getElementById(id);
const capienza = () => TEMPI[S.tempo];
const datiLivello = () => DATI.livelli[S.tempo][S.livello];
const valoreBattuta = b => b.reduce((t, p) => t + DATI.valori[p], 0);
const limitati = () => S.livello >= 7;

function messaggio(testo, tipo) { const m = $("messaggio"); m.textContent = testo || ""; m.className = "messaggio " + (tipo || ""); }

/* ===================== avvio di un livello ===================== */
function iniziaLivello(livello, verifica) {
  S.livello = livello; S.verifica = !!verifica;
  S.battute = Array.from({ length: datiLivello().measures }, () => []);
  S.corrente = 0; S.uso = { croma: 0, pausacroma: 0 }; S.errori = 0; S.inizio = null; S.bloccato = false;
  clearInterval(S.timer); $("cronometro").hidden = !S.verifica; $("cronometro").textContent = "0:00";
  $("chipVerifica").classList.toggle("attiva", S.verifica); $("chipVerifica").textContent = S.verifica ? "Verifica in corso" : "Verifica";
  document.body.classList.toggle("bianconero", S.livello >= 8);
  document.body.classList.toggle("trasparenti", S.livello >= 9);
  messaggio(S.verifica ? `Verifica: completa tutte le ${S.battute.length} battute. Il cronometro parte al primo mattoncino.` : "");
  disegnaTutto();
  mostraSchema();
}

/* ===================== disegno ===================== */
function mattone(tipo, larghezza, altezza) {
  const m = document.createElement("div");
  m.className = "mattone"; m.style.background = DATI.colori[tipo];
  if (larghezza != null) m.style.width = larghezza;
  if (altezza != null) m.style.height = altezza;
  m.innerHTML = DATI.simboli[tipo]; m.title = DATI.nomi[tipo] + " · " + DATI.frazioni[tipo];
  return m;
}
function disegnaBattuta() {
  const el = $("battuta"), b = S.battute[S.corrente] || [], cap = capienza();
  el.innerHTML = ""; el.classList.remove("completa");
  // suddivisioni: un tempo per riga (in 6/8 le crome, più marcate ogni tre); al livello 10 nessuna
  if (S.livello < 10) {
    const passi = S.tempo === "6/8" ? 6 : cap, forte = S.tempo === "6/8" ? 3 : 1;
    for (let i = 1; i < passi; i++) {
      const l = document.createElement("div"); l.className = "linea" + (i % forte === 0 && S.tempo === "6/8" ? " forte" : "");
      l.style.left = (i / passi * 100) + "%"; el.appendChild(l);
    }
  }
  const box = document.createElement("div"); box.className = "pezzi"; el.appendChild(box);
  b.forEach((tipo, i) => {
    const m = mattone(tipo, (DATI.valori[tipo] / cap * 100) + "%");
    m.dataset.i = i; m.title += " · tocca per toglierlo";
    m.addEventListener("click", () => togli(i));
    box.appendChild(m);
  });
  if (!b.length) el.insertAdjacentHTML("beforeend", `<div class="vuota">Tocca un mattoncino per aggiungerlo alla battuta</div>`);
  $("titoloBattuta").textContent = "Battuta " + (S.corrente + 1) + " · " + S.tempo;
  $("btnAnnulla").disabled = $("btnSvuota").disabled = !b.length;
  $("btnAscolta").disabled = !b.length;
  disegnaNotazione(b);
}
function disegnaTavolozza() {
  const el = $("tavolozza"), cap = capienza(), uguali = S.livello >= 9;
  el.innerHTML = "";
  const telefono = matchMedia("(max-width: 899px)").matches && !matchMedia("(max-height: 500px) and (orientation: landscape)").matches;
  const unita = telefono ? 24 : 46;                       // larghezza di una semiminima nella tavolozza
  datiLivello().pieces.forEach(tipo => {
    const b = document.createElement("button"); b.className = "pezzo"; b.type = "button";
    const largh = uguali ? 56 : Math.max(38, DATI.valori[tipo] * unita);
    b.appendChild(mattone(tipo, largh + "px"));
    const nome = document.createElement("div"); nome.className = "nome";
    nome.innerHTML = uguali ? "&nbsp;" : `${DATI.nomi[tipo]}<small>${DATI.frazioni[tipo]}</small>`;
    b.appendChild(nome);
    if (limitati() && LIMITATI[tipo]) {
      const r = LIMITATI[tipo] - S.uso[tipo];
      b.insertAdjacentHTML("beforeend", `<span class="resto" title="${PLURALI[tipo]} rimaste">${r}</span>`);
      if (r <= 0) b.classList.add("esaurito");
    }
    b.addEventListener("click", () => aggiungi(tipo));
    el.appendChild(b);
  });
  // sul telefono la tavolozza sta in basso: lascio sotto il contenuto lo spazio giusto
  requestAnimationFrame(() => { const t = document.querySelector(".tavolozza"); document.documentElement.style.setProperty("--spazio-tavolozza", (t.getBoundingClientRect().height + 20) + "px"); });
}
function disegnaFatte() {
  const el = $("fatte"), cap = capienza(); el.innerHTML = "";
  S.battute.forEach((b, i) => {
    const m = document.createElement("div"); m.className = "mini" + (i >= S.corrente ? " attesa" : ""); m.dataset.i = i;
    if (i < S.corrente) {
      b.forEach(t => { const s = document.createElement("span"); s.style.width = (DATI.valori[t] / cap * 100) + "%";
        s.style.background = S.livello >= 8 ? "#F1F5F9" : DATI.colori[t]; m.appendChild(s); });
      m.title = "Battuta " + (i + 1) + ": tocca per ascoltarla";
      m.addEventListener("click", () => ascolta(b, null));
    }
    m.insertAdjacentHTML("beforeend", `<span class="num" style="border:0;width:auto">${i + 1}</span>`);
    if (i < S.corrente + 4) el.appendChild(m);   // le battute fatte e le prossime quattro
  });
}
function disegnaStato() {
  const n = S.battute.length, fatte = Math.min(S.corrente, n);
  $("testoBattuta").textContent = fatte >= n ? `${n} battute completate` : `Battuta ${S.corrente + 1} di ${n}`;
  $("testoLivello").textContent = (S.verifica ? "Verifica · " : "") + "Livello " + S.livello;
  $("barraAvanz").style.width = (fatte / n * 100) + "%";
  $("chipTempo").textContent = S.tempo; $("chipLivello").textContent = "Livello " + S.livello;
  const lim = $("infoLimiti"); lim.hidden = !limitati();
  if (limitati()) lim.textContent = `Crome ${LIMITATI.croma - S.uso.croma}/25 · Pause di croma ${LIMITATI.pausacroma - S.uso.pausacroma}/25`;
}
function disegnaTutto() { disegnaBattuta(); disegnaTavolozza(); disegnaFatte(); disegnaStato(); }

/* ===================== la battuta scritta (motore degli spartiti) ===================== */
const XML_TIPO = { semibreve: ["whole", 8, 0], "minima-puntata": ["half", 6, 1], minima: ["half", 4, 0], "semiminima-puntata": ["quarter", 3, 1],
  semiminima: ["quarter", 2, 0], croma: ["eighth", 1, 0], pausesemibreve: ["whole", 8, 0], pauseminima: ["half", 4, 0], pausesemiminima: ["quarter", 2, 0], pausacroma: ["eighth", 1, 0] };
function battutaXML(b) {
  const [num, den] = S.tempo.split("/");
  const note = b.map(t => { const [tipo, dur, punto] = XML_TIPO[t], pausa = t.startsWith("paus");
    return `<note>${pausa ? (t === "pausesemibreve" ? '<rest measure="yes"/>' : "<rest/>") : "<pitch><step>B</step><octave>4</octave></pitch>"}<duration>${dur}</duration><type>${tipo}</type>${punto ? "<dot/>" : ""}</note>`; }).join("");
  return `<?xml version="1.0"?><score-partwise><part-list><score-part id="P1"><part-name>R</part-name></score-part></part-list><part id="P1"><measure number="1">` +
    `<attributes><divisions>2</divisions><key><fifths>0</fifths></key><time><beats>${num}</beats><beat-type>${den}</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>` +
    note + `<barline location="right"><bar-style>light-heavy</bar-style></barline></measure></part></score-partwise>`;
}
function disegnaNotazione(b) {
  const el = $("notazione");
  if (!b.length) { el.innerHTML = `<span class="segnaposto">Qui compare la battuta scritta sul pentagramma</span>`; return; }
  el.innerHTML = `<div class="spartito"></div>`;
  try {
    const brano = MotoreSchemi.leggiMusicXML(battutaXML(b));
    const larg = Math.max(260, Math.min(560, el.clientWidth - 16));
    MotoreSchemi.disegnaBrano(el.firstChild, brano, { strumento: "flauto", colori: false, nomi: false, larghezza: larg, perRiga: 1, titolo: false, schema: false, testi: false });
    const svg = el.querySelector("svg"); if (svg) { svg.style.maxWidth = larg + "px"; svg.style.margin = "0 auto"; svg.style.display = "block"; }
  } catch (e) { el.innerHTML = ""; }
}

/* ===================== mosse ===================== */
function aggiungi(tipo) {
  if (S.bloccato || S.corrente >= S.battute.length) return;
  const b = S.battute[S.corrente];
  if (S.verifica && !S.inizio) avviaCronometro();
  if (valoreBattuta(b) + DATI.valori[tipo] > capienza() + 1e-9) {
    messaggio(`Non c'è abbastanza spazio: la battuta deve valere ${S.tempo}.`, "avviso");
    $("battuta").classList.remove("errore"); void $("battuta").offsetWidth; $("battuta").classList.add("errore"); return;
  }
  if (limitati() && LIMITATI[tipo] && S.uso[tipo] >= LIMITATI[tipo]) { messaggio(`Hai finito le ${PLURALI[tipo]} disponibili (25).`, "avviso"); return; }
  b.push(tipo); if (LIMITATI[tipo]) S.uso[tipo]++;
  messaggio("");
  disegnaBattuta(); disegnaTavolozza(); disegnaStato();
  if (Math.abs(valoreBattuta(b) - capienza()) < 1e-9) battutaCompleta();
}
function togli(i) {
  if (S.bloccato) return;
  const b = S.battute[S.corrente], [t] = b.splice(i, 1);
  if (LIMITATI[t] && S.uso[t] > 0) S.uso[t]--;
  messaggio(""); disegnaBattuta(); disegnaTavolozza(); disegnaStato();
}
function svuota() {
  if (S.bloccato) return;
  S.battute[S.corrente].forEach(t => { if (LIMITATI[t] && S.uso[t] > 0) S.uso[t]--; });
  S.battute[S.corrente] = []; messaggio(""); disegnaBattuta(); disegnaTavolozza(); disegnaStato();
}
function battutaCompleta() {
  const b = S.battute[S.corrente], firma = b.join("|");
  const controllaIdentiche = S.verifica || !S.identiche;
  const doppia = controllaIdentiche ? S.battute.slice(0, S.corrente).findIndex(x => x.join("|") === firma) : -1;
  if (doppia >= 0 && !S.verifica) {
    // battuta identica a una precedente: si cancella e la precedente lampeggia
    b.forEach(t => { if (LIMITATI[t] && S.uso[t] > 0) S.uso[t]--; });
    S.battute[S.corrente] = [];
    messaggio(`Hai già costruito questa battuta (è la ${doppia + 1}): la nuova è stata cancellata.`, "errore");
    const mini = document.querySelector(`.mini[data-i="${doppia}"]`); if (mini) { mini.classList.remove("lampeggia"); void mini.offsetWidth; mini.classList.add("lampeggia"); }
    disegnaBattuta(); disegnaTavolozza(); disegnaStato(); return;
  }
  if (doppia >= 0) S.errori++;   // in verifica non si segnala: si conta come errore
  S.bloccato = true; $("battuta").classList.add("completa");
  if (!S.verifica) messaggio("Battuta completa!", "ok");
  suonoOk(); spawnConfetti($("battuta"), 30);
  setTimeout(() => {
    S.corrente++; S.bloccato = false;
    if (S.corrente >= S.battute.length) return fineLivello();
    disegnaTutto(); messaggio("");
  }, 650);
}

/* ===================== cronometro della verifica ===================== */
function avviaCronometro() {
  S.inizio = performance.now(); clearInterval(S.timer);
  S.timer = setInterval(() => { $("cronometro").textContent = formatoTempo(performance.now() - S.inizio); }, 250);
}
const formatoTempo = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const voto = errori => Math.max(1, 10 - 0.5 * Math.ceil(errori / 2));   // come nell'originale, ma mai sotto 1

/* ===================== finestre ===================== */
function apri(id) { document.querySelectorAll(".finestra").forEach(f => f.classList.toggle("aperta", f.id === id)); }
function chiudi() { document.querySelectorAll(".finestra").forEach(f => f.classList.remove("aperta")); }
function mostraSchema() {
  const d = datiLivello(), cap = capienza();
  $("schemaTitolo").textContent = (S.verifica ? "Verifica · " : "") + "Livello " + S.livello + " · " + S.tempo;
  $("schemaDescr").textContent = d.description + ` Battute da completare: ${d.measures}.`;
  const box = $("schemaBarre"); box.innerHTML = "";
  d.pieces.forEach(t => {
    const r = document.createElement("div"); r.className = "schema-riga";
    r.appendChild(mattone(t, (DATI.valori[t] / cap * 260) + "px"));
    r.insertAdjacentHTML("beforeend", `<span>${DATI.nomi[t]} · ${DATI.frazioni[t]}</span>`);
    box.appendChild(r);
  });
  apri("finSchema");
}
function fineLivello() {
  clearInterval(S.timer); disegnaTutto();
  const pul = $("finePulsanti"); pul.innerHTML = "";
  const bottone = (testo, classe, fn) => { const b = document.createElement("button"); b.className = "grande " + (classe || ""); b.textContent = testo; b.onclick = fn; pul.appendChild(b); };
  if (S.verifica) {
    const t = formatoTempo(performance.now() - (S.inizio || performance.now())), v = voto(S.errori);
    $("fineTitolo").textContent = "Verifica completata";
    $("fineRisultato").textContent = String(v).replace(".", ",");
    $("fineDescr").textContent = `Tempo: ${t} · battute identiche (errori): ${S.errori}`;
    bottone("Rifai la verifica", "arancio", () => iniziaLivello(10, true));
    bottone("Torna agli esercizi", "secondario", () => { chiudi(); apriAvvio(); });
  } else {
    $("fineTitolo").textContent = "Livello " + S.livello + " completato!";
    $("fineRisultato").textContent = "★";
    if (S.livello < 10) {
      const prossimo = DATI.livelli[S.tempo][S.livello + 1];
      $("fineDescr").textContent = "Livello " + (S.livello + 1) + ": " + prossimo.description;
      bottone("Livello " + (S.livello + 1), "", () => iniziaLivello(S.livello + 1));
    } else {
      $("fineDescr").textContent = "Hai completato tutti i livelli in " + S.tempo + ". Prova un altro tempo o la verifica!";
      bottone("Verifica", "arancio", () => iniziaLivello(10, true));
    }
    bottone("Scegli tempo e livello", "secondario", () => { chiudi(); apriAvvio(); });
  }
  apri("finFine"); suonoFine();
  requestAnimationFrame(() => { spawnConfetti(document.querySelector("#finFine .riquadro"), 70, 140); setTimeout(() => spawnConfetti(document.querySelector("#finFine .riquadro"), 50, 120), 350); });
}
let sceltaTempo = "4/4", sceltaLivello = 1;
function apriAvvio() {
  sceltaTempo = S.tempo; sceltaLivello = S.livello;
  const tt = $("sceltaTempo"); tt.innerHTML = "";
  Object.keys(TEMPI).forEach(t => {
    const b = document.createElement("button"); b.className = "scelta" + (t === sceltaTempo ? " attiva" : ""); b.innerHTML = `${t}<small>${NOMI_TEMPO[t]}</small>`;
    b.onclick = () => { sceltaTempo = t; apriAvvioAggiorna(); }; tt.appendChild(b);
  });
  apriAvvioAggiorna(); apri("finAvvio");
}
function apriAvvioAggiorna() {
  [...$("sceltaTempo").children].forEach((b, i) => b.classList.toggle("attiva", Object.keys(TEMPI)[i] === sceltaTempo));
  const ll = $("sceltaLivello"); ll.innerHTML = "";
  for (let n = 1; n <= 10; n++) {
    const b = document.createElement("button"); b.className = "scelta" + (n === sceltaLivello ? " attiva" : ""); b.textContent = n;
    b.onclick = () => { sceltaLivello = n; apriAvvioAggiorna(); }; ll.appendChild(b);
  }
  const d = DATI.livelli[sceltaTempo][sceltaLivello];
  $("descrLivello").textContent = `${d.description} (${d.measures} battute)`;
}

/* ===================== suoni (generati dal browser) ===================== */
let AC = null, riproduzione = null;
const audio = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function tono(t0, durata, freq, vol, tipo) {
  const ac = audio(), o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.setValueAtTime(vol * 0.75, t0 + Math.max(0.03, durata - 0.06)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + durata);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + durata + 0.02);
}
/* clic del metronomo: lo stesso dei giochi del sito (primo tempo un po' più acuto) */
const click = (t0, forte) => toneGiochiA(t0, forte ? 780 : 520, 0.08, "triangle", forte ? 0.3 : 0.22);
function toneGiochiA(t0, freq, durata, tipo, vol) {
  const ctx = audio(); if (!volumeGiochi) { volumeGiochi = ctx.createGain(); volumeGiochi.gain.value = 0.75; volumeGiochi.connect(ctx.destination); }
  const osc = ctx.createOscillator(), gain = ctx.createGain(); osc.type = tipo; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durata);
  osc.connect(gain); gain.connect(volumeGiochi); osc.start(t0); osc.stop(t0 + durata + 0.05);
}
/* pianoforte: lo stesso di "Leggi la nota" (fondamentale + armoniche, filtro che si scurisce);
   in più, alla fine della figura il suono si smorza come quando si alza il dito dal tasto */
function pianoforte(t0, freq, durataFigura) {
  const ctx = audio(); if (!volumeGiochi) { volumeGiochi = ctx.createGain(); volumeGiochi.gain.value = 0.75; volumeGiochi.connect(ctx.destination); }
  const duration = 1.9, fine = t0 + Math.min(durataFigura, duration);
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass"; filter.frequency.setValueAtTime(6500, t0); filter.frequency.exponentialRampToValueAtTime(800, t0 + duration); filter.Q.value = 0.6;
  filter.connect(volumeGiochi);
  [{ mult: 1, gain: 0.5, decay: duration }, { mult: 2, gain: 0.24, decay: duration * 0.8 }, { mult: 3, gain: 0.14, decay: duration * 0.6 },
   { mult: 4, gain: 0.08, decay: duration * 0.45 }, { mult: 6, gain: 0.04, decay: duration * 0.3 }].forEach(h => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = freq * h.mult;
    const stop = Math.min(t0 + h.decay, fine);
    gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(h.gain, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, h.gain * Math.pow(0.0001 / h.gain, (stop - t0) / h.decay)), stop);
    gain.gain.exponentialRampToValueAtTime(0.0001, stop + 0.07);            // smorzatore
    osc.connect(gain); gain.connect(filter); osc.start(t0); osc.stop(stop + 0.1);
  });
}
/* fa sentire la battuta: una battuta di metronomo, poi il ritmo (le pause sono silenzio) */
function ascolta(b, mattoni) {
  if (!b.length) return;
  const ac = audio(); if (ac.state === "suspended") ac.resume();
  if (riproduzione) riproduzione.forEach(clearTimeout); riproduzione = [];
  const q = 60 / 84;                                              // durata di una semiminima
  const passo = S.tempo === "6/8" ? 1.5 : 1, battiti = Math.round(capienza() / passo);
  let t = ac.currentTime + 0.12;
  for (let i = 0; i < battiti; i++) click(t + i * passo * q, i === 0);   // battuta di attacco
  t += capienza() * q;
  for (let i = 0; i < battiti; i++) click(t + i * passo * q, i === 0);   // il metronomo continua sotto il ritmo
  let x = t;
  b.forEach((tipo, i) => {
    const d = DATI.valori[tipo] * q;
    if (!tipo.startsWith("paus")) pianoforte(x, 493.88, d);      // il si, come sul pentagramma
    if (mattoni && mattoni[i]) {
      const m = mattoni[i], ritardo = (x - ac.currentTime) * 1000;
      riproduzione.push(setTimeout(() => m.classList.add("suona"), ritardo), setTimeout(() => m.classList.remove("suona"), ritardo + d * 1000 - 40));
    }
    x += d;
  });
}
/* suoni di risposta giusta e di vittoria: gli stessi degli altri giochi del sito */
let volumeGiochi = null;
function toneGiochi(freq, duration, type, delay) {
  const ctx = audio();
  if (!volumeGiochi) { volumeGiochi = ctx.createGain(); volumeGiochi.gain.value = 0.75; volumeGiochi.connect(ctx.destination); }
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || "sine"; osc.frequency.value = freq;
  const t0 = ctx.currentTime + (delay || 0);
  gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain); gain.connect(volumeGiochi); osc.start(t0); osc.stop(t0 + duration + 0.05);
}
function suonoOk() { try { [523, 659, 784, 1047].forEach((f, i) => toneGiochi(f, 0.18, "sine", i * 0.09)); } catch (e) {} }
function suonoFine() {
  try {
    const run = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
    run.forEach((f, i) => toneGiochi(f, 0.32, "triangle", i * 0.1));
    const chordStart = run.length * 0.1 + 0.06;
    [1046.50, 1318.51, 1567.98, 2093.00].forEach(f => { toneGiochi(f, 1.3, "sine", chordStart); toneGiochi(f * 2, 0.7, "sine", chordStart); });
  } catch (e) {}
}
/* coriandoli: gli stessi degli altri giochi, che esplodono dal centro di un elemento */
const confettiColors = ["#f59e0b", "#22c55e", "#3b82f6", "#ec4899", "#a855f7", "#facc15", "#06b6d4"];
function spawnConfetti(elemento, quanti, distanza) {
  const r = elemento.getBoundingClientRect(), strato = document.getElementById("strato-coriandoli");
  // su PC e LIM la pagina è ingrandita: le misure vanno riportate nella scala della pagina
  const z = window.fattoreSchermo ? window.fattoreSchermo() : 1;
  for (let i = 0; i < (quanti || 30); i++) {
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.left = ((r.left + r.width / 2) / z) + "px"; piece.style.top = ((r.top + r.height / 2) / z) + "px";
    const angle = Math.random() * Math.PI * 2, distance = (distanza || 70) + Math.random() * (distanza ? distanza * 1.6 : 110);
    piece.style.setProperty("--dx", Math.cos(angle) * distance + "px");
    piece.style.setProperty("--dy", (Math.sin(angle) * distance - 20) + "px");
    piece.style.setProperty("--rot", (Math.random() * 480 - 240) + "deg");
    piece.style.background = confettiColors[i % confettiColors.length];
    piece.style.width = (5 + Math.random() * 5) + "px"; piece.style.height = piece.style.width;
    piece.style.animationDelay = (Math.random() * 0.08) + "s";
    strato.appendChild(piece);
    setTimeout(() => piece.remove(), 1100);
  }
}

$("btnAscolta").onclick = () => ascolta(S.battute[S.corrente] || [], [...document.querySelectorAll("#battuta .mattone")]);
$("btnAnnulla").onclick = () => { const b = S.battute[S.corrente]; if (b && b.length) togli(b.length - 1); };

$("finSchema").addEventListener("click", e => { if (e.target.id === "finSchema") chiudi(); });
let rid; addEventListener("resize", () => { clearTimeout(rid); rid = setTimeout(() => { disegnaBattuta(); disegnaTavolozza(); }, 200); });
iniziaLivello(1); chiudi(); apriAvvio();
</script>

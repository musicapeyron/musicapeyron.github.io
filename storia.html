<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storia della musica — musicascuole.it</title>
<meta name="description" content="La storia della musica raccontata attraverso gli ascolti, un'epoca alla volta.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  PAGINA STORIA DELLA MUSICA — per aggiungere un'epoca: crea la sua pagina
  (copiando storia-medioevo.html) e scrivi il suo indirizzo in "url" nell'elenco EPOCHE qui sotto.
-->
<link rel="stylesheet" href="comune.css">
<link rel="stylesheet" href="sito.css">
<style>
  /* le epoche: qui le foto sono il contenuto, quindi restano schede con immagine */
  .epoche { list-style: none; margin: clamp(22px, 2.6vw, 48px) 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: clamp(14px, 1.4vw, 28px); }
  .epoca { display: flex; flex-direction: column; height: 100%; text-decoration: none; color: inherit;
    background: var(--superficie); border-radius: var(--raggio); overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,27,60,0.08), 0 8px 20px -14px rgba(20,27,60,0.35);
    transition: transform 180ms var(--esci), box-shadow 180ms var(--esci); }
  .epoca .foto { aspect-ratio: 16 / 10; background: var(--linea) center / cover no-repeat; }
  .epoca .testo { padding: 0.9rem 1.1rem 1.15rem; }
  .epoca .date { font-family: var(--titoli); font-weight: 800; font-size: 0.9rem; letter-spacing: 0.01em; color: var(--si); font-variant-numeric: tabular-nums; }
  .epoca h2 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; margin-top: 0.1em; }
  .epoca p { margin: 0.3em 0 0; color: var(--inchiostro-2); font-size: 0.86rem; line-height: 1.4; }
  .epoca:active { transform: scale(0.985); }
  @media (hover: hover) and (pointer: fine) { a.epoca:hover { transform: translateY(-3px); box-shadow: 0 1px 2px rgba(20,27,60,0.08), 0 16px 26px -16px rgba(20,27,60,0.45); } }
  .epoca.presto { opacity: 0.6; }
  @media (prefers-color-scheme: dark) { .epoca .date { color: #F07FC1; } }
  @media (max-width: 640px) {
    .epoca { flex-direction: row; }
    .epoca .foto { aspect-ratio: auto; width: 34%; flex: none; }
    .epoca .testo { padding: 0.75rem 0.9rem; }
    .epoca h2 { font-size: 1.15rem; }
  }
  @media (prefers-reduced-motion: reduce) { .epoca { transition: none; } .epoca:hover, .epoca:active { transform: none; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="freccia" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="barra-alta contenitore">
  <a class="casa" href="index.html" aria-label="Torna alla pagina principale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>musicascuole.it</a>
</div>

<header class="contenitore">
  <div class="lamella-titolo" style="--col: var(--si);">
    <span class="tasto"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-storia"/></svg></span>
    <div><h1>Storia della musica</h1><p>Un'epoca alla volta, attraverso gli ascolti: brani, strumenti e curiosità.</p></div>
  </div>
</header>

<main class="contenitore">
  <ol class="epoche" id="grid" aria-label="Le epoche, dalla più antica"></ol>
</main>

<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>

<script>
  const EPOCHE = [
    { titolo: "Preistoria e antichità", date: "fino al 476 d.C.", desc: "Flauti d'osso, pietre sonore, la melodia più antica, Grecia e Roma.", url: "storia-antichita.html", img: "media/storia/antichita/banner-grotta.jpg" },
    { titolo: "Medioevo", date: "476 – 1492", desc: "Canto gregoriano, polifonia, trovatori e danze di corte.", url: "storia-medioevo.html", img: "media/storia/medioevo/banner-castello.jpg" },
    { titolo: "Rinascimento", date: "1450 – 1600", desc: "Roma e Venezia, Palestrina e Gabrieli, madrigali e danze.", url: "storia-rinascimento.html", img: "media/storia/rinascimento/banner-venezia.jpg" },
    { titolo: "Barocco", date: "1600 – 1750", desc: "Opera e concerto, Vivaldi, Händel e la fuga di Bach.", url: "storia-barocco.html", img: "media/storia/barocco/banner-teatro.jpg" },
    { titolo: "Classicismo", date: "1750 – 1820", desc: "La corte e la città: Haydn, Mozart e il giovane Beethoven.", url: "storia-classicismo.html", img: "media/storia/classicismo/banner-corte.jpg" },
    { titolo: "Romanticismo", date: "1820 – 1900", desc: "Intimismo e virtuosismo: Chopin, Paganini, Verdi e l'opera.", url: "storia-romanticismo.html", img: "media/storia/romanticismo/banner-virtuosismo.jpg" },
    { titolo: "Novecento", date: "1900 – 2000", desc: "Scuole nazionali e avanguardie: da Bartók a Cage.", url: "storia-novecento.html", img: "media/storia/novecento/banner-nazionali.jpg" },
    { titolo: "Jazz e popular", date: "dal 1900 a oggi", desc: "Dal blues al be-bop, dai Beatles al rap.", url: "storia-jazz-pop.html", img: "media/storia/jazz-pop/banner-jazz.jpg" }
  ];
  const g = document.getElementById("grid");
  EPOCHE.forEach(e => {
    const li = document.createElement("li");
    li.innerHTML = `<${e.url ? `a href="${e.url}"` : "div"} class="epoca${e.url ? "" : " presto"}">
        <div class="foto" ${e.img ? `style="background-image:url('${e.img}')"` : ""}></div>
        <div class="testo"><span class="date">${e.url ? e.date : "presto"}</span><h2>${e.titolo}</h2><p>${e.url ? e.desc : e.date}</p></div>
      </${e.url ? "a" : "div"}>`;
    g.appendChild(li);
  });
</script>
</body>
</html>

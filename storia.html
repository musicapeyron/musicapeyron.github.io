<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storia della musica — musicascuole.it</title>
<meta name="description" content="La storia della musica raccontata attraverso gli ascolti, un'epoca alla volta.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  PAGINA STORIA DELLA MUSICA — per aggiungere un'epoca: crea la sua pagina
  (copiando storia-medioevo.html) e scrivi il suo indirizzo in "url" nell'elenco EPOCHE qui sotto.
-->
<link rel="stylesheet" href="fonts/caratteri.css">
<link rel="stylesheet" href="comune.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: #EAF2FF; -webkit-font-smoothing: antialiased;
    background: #0f172a; overflow-x: hidden; position: relative; }
  .casetta { position: fixed; top: 12px; left: 12px; z-index: 40; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(15,23,42,0.75); border: 1px solid rgba(255,255,255,0.18); text-decoration: none; font-size: 20px; }
  header { position: relative; z-index: 1; text-align: center; padding: 26px 20px 14px; }
  h1 { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 25px; margin: 0 0 6px; letter-spacing: -0.015em; }
  header p { font-size: 13px; color: #9FB3CE; margin: 0 auto; max-width: 460px; line-height: 1.45; }
  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 8px 20px 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 9px; } main { padding: 6px 12px 24px; } header { padding-top: 64px; } }
  .card { --accent: #CF3E96; position: relative; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-top: 2px solid var(--accent);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
  a.card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.06); border-color: color-mix(in srgb, var(--accent) 55%, transparent); border-top-color: var(--accent); }
  .card .foto { aspect-ratio: 16 / 9; background: #1e293b center / cover no-repeat; display: grid; place-items: center; font-size: 34px; }
  .card .testo { padding: 10px 12px 12px; }
  .card .date { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .card h2 { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; margin: 5px 0 2px; }
  .card p { font-size: 11.5px; color: #9FB3CE; margin: 0; line-height: 1.4; }
  .card.presto { border-style: dashed; background: transparent; }
  .card.presto .foto { background: rgba(255,255,255,0.03); color: rgba(234,242,255,0.35); }
  .card.presto h2 { color: #8EA3C0; }
  .card.presto .date { color: #7F93B2; background: rgba(255,255,255,0.06); }
  footer.piede { position: relative; z-index: 1; text-align: center; font-size: 13px; color: #9FB3CE; padding: 12px 12px 24px; }
</style>
</head>
<body>
<a class="casetta" href="index.html" aria-label="Torna al sito" title="Torna al sito">🏠</a>
<header>
  <h1>Storia della musica</h1>
  <p>Un'epoca alla volta, attraverso gli ascolti: brani, strumenti e curiosità.</p>
</header>
<main><div class="grid" id="grid"></div></main>
<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>
<script>
  const EPOCHE = [
    { titolo: "Preistoria e antichità", date: "fino al 476 d.C.", desc: "Flauti d'osso, pietre sonore, la melodia più antica, Grecia e Roma.", url: "storia-antichita.html", img: "media/storia/antichita/banner-grotta.jpg" },
    { titolo: "Medioevo", date: "476 – 1492", desc: "Canto gregoriano, polifonia, trovatori e danze di corte.", url: "storia-medioevo.html", img: "media/storia/medioevo/banner-castello.jpg" },
    { titolo: "Rinascimento", date: "1450 – 1600", desc: "Roma e Venezia, Palestrina e Gabrieli, madrigali e danze.", url: "storia-rinascimento.html", img: "media/storia/rinascimento/banner-venezia.jpg" },
    { titolo: "Barocco", date: "1600 – 1750", desc: "Opera e concerto, Vivaldi, Händel e la fuga di Bach.", url: "storia-barocco.html", img: "media/storia/barocco/banner-teatro.jpg" },
    { titolo: "Classicismo", date: "1750 – 1820", desc: "La corte e la città: Haydn, Mozart e il giovane Beethoven.", url: "storia-classicismo.html", img: "media/storia/classicismo/banner-corte.jpg" },
    { titolo: "Romanticismo", date: "1820 – 1900", desc: "Intimismo e virtuosismo: Chopin, Paganini, Verdi e l'opera.", url: "storia-romanticismo.html", img: "media/storia/romanticismo/banner-virtuosismo.jpg" },
    { titolo: "Novecento", date: "1900 – 2000", desc: "Scuole nazionali e avanguardie: da Bartók a Cage.", url: "storia-novecento.html", img: "media/storia/novecento/banner-nazionali.jpg" },
    { titolo: "Jazz e popular", date: "dal 1900 a oggi", desc: "Dal blues al be-bop, dai Beatles al rap.", url: "storia-jazz-pop.html", img: "media/storia/jazz-pop/banner-jazz.jpg" }
  ];
  const g = document.getElementById("grid");
  EPOCHE.forEach(e => {
    const el = document.createElement(e.url ? "a" : "div");
    el.className = "card" + (e.url ? "" : " presto");
    if (e.url) el.href = e.url;
    el.innerHTML = `<div class="foto" ${e.img ? `style="background-image:url('${e.img}')"` : ""}>${e.img ? "" : e.icona}</div>
      <div class="testo"><span class="date">${e.url ? e.date : "presto"}</span><h2>${e.titolo}</h2><p>${e.url ? e.desc : e.date}</p></div>`;
    g.appendChild(el);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="description" content="Lezione interattiva per la LIM: il punto di valore e il doppio punto, sulle note e sulle pause, con le barre della durata, l'ascolto e le battute di esempio.">

<style>
/* =========================================================
   Il punto di valore — lezione interattiva a passi (stesso motore di note-sul-pentagramma.html;
   si rigenera con _sviluppo/lezioni/costruisci.py a partire dai file in _sviluppo/lezioni/).
   Ogni passo ha delle "fasi": Avanti mostra la fase successiva, poi il passo successivo.
   I simboli (chiavi, teste, numeri del tempo) sono tracciati di VexFlow salvati qui sotto
   nella costante GLIFI: la pagina non carica la libreria.
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; color: #EAF2FF;
  -webkit-font-smoothing: antialiased; padding: 36px 14px 12px; position: relative; }
button { font-family: inherit; }

/* colori dei capitoli */
:root { --c0: #38BDF8; --c1: #A78BFA; --c2: #FBBF24; --c3: #34D399; --cap: var(--c0);
  --carta: rgba(30, 41, 59, 0.62); --bordo: rgba(255,255,255,0.12); --tenue: #9FB3CE; }

.casetta { position: fixed; top: 12px; left: 12px; z-index: 40; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; text-decoration: none; font-size: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05)); border: 1px solid rgba(255,255,255,0.18); }
.casetta:hover { filter: brightness(1.2); }

.lezione { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* ---------- testata: titolo e indice ---------- */
.riga-titolo { display: flex; align-items: center; gap: 14px; padding-left: 50px; }
.riga-titolo h1 { margin: 0; font-family: 'Fredoka', 'Manrope', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.1; }
.riga-titolo .sopra { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #FDE7C7; }
.riga-titolo .spazio-vuoto { flex: 1; }
.contatore { font-family: 'Manrope', sans-serif; font-weight: 700; color: var(--tenue); font-size: 14px; }
.interruttore { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 14px; color: #EAF2FF; cursor: pointer;
  background: rgba(15,23,42,0.6); border: 1px solid var(--bordo); border-radius: 999px; padding: 7px 14px; }
.interruttore.attivo { background: #EAF2FF; color: #0f172a; }

.indice { display: flex; gap: 8px; }
.gruppo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gruppo .cap { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--colore); padding-left: 4px; white-space: nowrap; }
.gruppo .pillole { display: flex; gap: 3px; }
.pillola { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 5px; cursor: pointer; text-align: left;
  padding: 5px 4px 5px 4px; border-radius: 12px; height: 44px; color: #CBD5E1;
  background: var(--carta); border: 1px solid var(--bordo); border-bottom: 3px solid color-mix(in srgb, var(--colore) 45%, transparent);
  font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12px; line-height: 1.12; hyphens: manual; }
.pillola .n { flex: 0 0 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px;
  border: 2px solid color-mix(in srgb, var(--colore) 70%, transparent); color: var(--colore); }
.pillola .t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pillola:hover { filter: brightness(1.2); }
.pillola.vista .n { background: color-mix(in srgb, var(--colore) 22%, transparent); }
.pillola.attiva { background: var(--colore); color: #0f172a; border-color: var(--colore); }
.pillola.attiva .n { background: #0f172a; color: var(--colore); border-color: #0f172a; }

/* ---------- corpo: palco (disegno) e spiegazione ---------- */
.corpo { display: grid; grid-template-columns: 880px 1fr; gap: 14px; }
.scheda { background: var(--carta); border: 1px solid var(--bordo); border-top: 4px solid var(--cap); border-radius: 18px; }
.palco-card { display: grid; grid-template-rows: 54px 1fr auto; overflow: hidden; }
.cartellino { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 14px; text-align: center;
  font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 22px; color: #F8FAFC; border-bottom: 1px solid rgba(255,255,255,0.06); }
.cartellino .piccolo { font-weight: 600; font-size: 17px; color: var(--tenue); }
.cartellino .c-in { line-height: 1.2; }
.cartellino .mini { margin: 0 2px; }
.cartellino.lampo { animation: lampo .5s ease-out; }
@keyframes lampo { from { background: rgba(255,255,255,0.07); } to { background: transparent; } }
.palco { position: relative; min-height: 0; }
.palco > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.strumenti { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px 12px; min-height: 66px; }
.strumenti .suggerimento { color: var(--tenue); font-size: 15px; font-style: italic; }
.btn { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 16px; color: #EAF2FF; cursor: pointer;
  background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px 16px; line-height: 1.1; }
.btn:hover { filter: brightness(1.25); }
.btn:active { filter: brightness(0.9); }
.btn.forte { background: var(--cap); color: #0f172a; border-color: var(--cap); }
.btn.on { background: #EAF2FF; color: #0f172a; }
.btn:disabled { opacity: .35; cursor: default; filter: none; }
.segmenti { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; overflow: hidden; }
.segmenti .btn { border: 0; border-radius: 0; border-left: 1px solid rgba(255,255,255,0.15); }
.segmenti .btn:first-child { border-left: 0; }

.spiega { padding: 16px 22px 18px; display: flex; flex-direction: column; overflow: hidden; }
.spiega .capitolo { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--cap); }
.spiega h2 { font-family: 'Fredoka', 'Manrope', sans-serif; font-weight: 600; font-size: 31px; line-height: 1.1; margin: 4px 0 12px; }
.punti { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.punti li { font-size: var(--fs, 20px); line-height: 1.38; padding-left: 26px; position: relative; color: #CBD5E1; cursor: pointer; transition: color .3s; }
.punti li::before { content: ""; position: absolute; left: 4px; top: .58em; width: 10px; height: 10px; border-radius: 50%; background: var(--cap); opacity: .55; }
.punti li.dopo { display: none; }
.punti li.ora { color: #fff; }
.punti li.ora::before { opacity: 1; box-shadow: 0 0 0 4px color-mix(in srgb, var(--cap) 30%, transparent); }
.punti li b { color: #fff; }
.quaderno { margin-top: auto; padding: 10px 14px 11px; border-radius: 12px; background: rgba(253, 231, 199, 0.08);
  border: 1px dashed rgba(253, 231, 199, 0.45); font-size: var(--fq, 15.5px); line-height: 1.4; color: #FDE7C7; }
.quaderno .tit { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 3px; }
.quaderno p { margin: 3px 0 0; }
.quaderno[hidden] { display: none; }

/* ---------- piede: frecce e fasi ---------- */
.piede-lezione { display: grid; grid-template-columns: 200px 1fr 260px; align-items: center; gap: 12px; height: 62px; }
.nav-btn { justify-self: start; height: 56px; padding: 0 22px; border-radius: 999px; cursor: pointer; font-family: 'Manrope', sans-serif;
  font-weight: 800; font-size: 18px; color: #EAF2FF; background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.18); }
.avanti { justify-self: end; height: 58px; width: 100%; border-radius: 999px; cursor: pointer; border: 0; font-family: 'Manrope', sans-serif;
  font-weight: 800; font-size: 22px; color: #0f172a; background: var(--cap); }
.nav-btn:hover, .avanti:hover { filter: brightness(1.15); }
.nav-btn:active, .avanti:active { filter: brightness(0.92); }
.nav-btn:disabled, .avanti:disabled { opacity: .3; cursor: default; filter: none; }
.fasi { display: flex; justify-content: center; gap: 10px; }
.fasi button { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 16px;
  color: #CBD5E1; background: transparent; border: 2px solid rgba(255,255,255,0.25); }
.fasi button.fatta { border-color: var(--cap); color: var(--cap); }
.fasi button.ora { background: var(--cap); border-color: var(--cap); color: #0f172a; }

/* ---------- ripasso finale (senza palco) ---------- */
.lezione.solo-testo .corpo { grid-template-columns: 1fr; }
.lezione.solo-testo .spiega { display: none; }
.lezione.solo-testo .palco-card { grid-template-rows: 54px 1fr auto; }
.ripasso { position: absolute; inset: 0; padding: 12px 16px 6px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 9px; }
.def { background: rgba(15,23,42,0.55); border: 1px solid var(--bordo); border-left: 4px solid var(--colore); border-radius: 12px;
  padding: 6px 11px; font-size: 14px; line-height: 1.3; color: #CBD5E1; cursor: pointer; text-align: left; font-family: inherit; overflow: hidden; }
.def:hover { filter: brightness(1.2); }
.def b { color: #fff; font-family: 'Manrope', sans-serif; font-weight: 800; }
.def .vai { float: right; color: var(--colore); font-weight: 800; font-family: 'Manrope', sans-serif; font-size: 12.5px; }
.allenati { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.allenati span { color: var(--tenue); font-weight: 700; font-family: 'Manrope', sans-serif; }
.allenati a { text-decoration: none; }

/* ---------- il disegno ---------- */
svg { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.riga { stroke: rgba(234,242,255,0.85); stroke-width: 2.4; stroke-linecap: round; transition: stroke .35s, stroke-width .35s; }
.riga.accesa { stroke: var(--luce, #FDE047); stroke-width: 6; filter: drop-shadow(0 0 7px var(--luce, #FDE047)); }
.spazio { fill: var(--luce, #38BDF8); opacity: 0; transition: opacity .35s; }
.spazio.acceso { opacity: .32; }
.rigo.disegna .riga { stroke-dasharray: 1000; animation: traccia .8s ease-out both; animation-delay: calc(var(--i) * .16s); }
@keyframes traccia { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
.taglio { stroke: rgba(234,242,255,0.9); stroke-width: 2.6; stroke-linecap: round; }
.taglio.nuovo { stroke-dasharray: 70; animation: traccia2 .6s ease-out both; }
@keyframes traccia2 { from { stroke-dashoffset: 70; } to { stroke-dashoffset: 0; } }
.stanghetta { stroke: rgba(234,242,255,0.9); stroke-width: 2.6; transition: stroke .3s; }
.stanghetta.grossa { stroke-width: 9; }
.glifo { fill: #EAF2FF; transition: fill .35s, filter .35s; }
.evid, .evid .glifo, .evid.glifo { fill: var(--luce, #FDE047) !important; filter: drop-shadow(0 0 8px var(--luce, #FDE047)); }
.stanghetta.evid { stroke: var(--luce, #FDE047); filter: drop-shadow(0 0 8px var(--luce, #FDE047)); }
.anello { fill: none; stroke: var(--luce, #FDE047); stroke-width: 4; opacity: 0; transform-box: fill-box; transform-origin: center; }
.anello.via { animation: anello 1.1s ease-out 3; }
@keyframes anello { 0% { opacity: .95; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.8); } }

.nota .testa { fill: #EAF2FF; transition: fill .3s, opacity .3s; }
.nota .gambo { stroke: #EAF2FF; stroke-width: 2.4; }
.nota { transition: opacity .35s; cursor: pointer; }
.nota.nascosta, .nome.nascosto, .vela.nascosto { opacity: 0; pointer-events: none; }
.nota.compare { animation: compare .45s ease-out; }
@keyframes compare { from { opacity: 0; } to { opacity: 1; } }
.nota.luce .testa { filter: drop-shadow(0 0 9px #fff) drop-shadow(0 0 4px #fff); }
/* «salto» a tempo: la nota si ingrandisce un poco e torna com'era (al posto della luce, più sicuro per gli occhi) */
.pop { transform-box: fill-box; transform-origin: 50% 70%; animation: pop .22s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.nota.tenue { opacity: .45; }
.nome { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 25px; fill: #EAF2FF; text-anchor: middle; transition: opacity .3s, fill .3s;
  paint-order: stroke; stroke: #172036; stroke-width: 6px; stroke-linejoin: round; }
.nome.coperto { fill: rgba(234,242,255,0.5); }
.nome { transform-box: fill-box; transform-origin: center; transition: opacity .3s, fill .3s, transform .15s; }
.nome.luce { transform: scale(1.22); filter: drop-shadow(0 0 7px #fff); }
.gambo-evid .gambo { stroke: #FDE047; stroke-width: 4; filter: drop-shadow(0 0 6px #FDE047); }
.mano .tratto { fill: none; stroke: #EAF2FF; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.mano .punta { fill: #FBBF24; stroke: #0f172a; stroke-width: 3; }
.mano .pallino, .mano .puntino { fill: #EAF2FF; }
.passino circle { fill: #FBBF24; } .passino text { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 17px; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
.chiave { transition: opacity .5s; }
.etic { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 19px; fill: #CBD5E1; letter-spacing: .04em;
  paint-order: stroke; stroke: #172036; stroke-width: 7px; stroke-linejoin: round; }
.etic.grande { font-size: 24px; }
.num-cerchio circle { fill: rgba(15,23,42,0.85); stroke: var(--luce, #EAF2FF); stroke-width: 2.5; }
.num-cerchio text { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; fill: #EAF2FF; text-anchor: middle; dominant-baseline: central; }
.num-cerchio { transition: opacity .3s; }
.vela { transition: opacity .35s; }
.colpo { fill: transparent; cursor: pointer; }
.colpo:hover + .ombra, .colpo:hover { fill: rgba(255,255,255,0.06); }
.freccia { stroke: var(--luce, #FBBF24); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.cursore { fill: none; stroke: #fff; stroke-width: 3.5; transition: transform .25s ease, opacity .25s; }
.palla { fill: rgba(234,242,255,0.18); stroke: rgba(234,242,255,0.55); stroke-width: 2.5; transition: fill .08s, stroke .08s; }
.palla.forte { stroke-width: 4; }
.palla.batte { fill: var(--luce, #FBBF24); stroke: #fff; }
.conta { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 24px; fill: #9FB3CE; text-anchor: middle; transition: fill .08s; }
.conta.batte { fill: #fff; }

/* colori delle note (attivi di default; si spengono con il pulsante 🎨) */
body.colori .nota.c-do .testa { fill: var(--do); } body.colori .nome.c-do { fill: var(--do); }
body.colori .nota.c-re .testa { fill: var(--re); } body.colori .nome.c-re { fill: var(--re); }
body.colori .nota.c-mi .testa { fill: var(--mi); } body.colori .nome.c-mi { fill: var(--mi); }
body.colori .nota.c-fa .testa { fill: var(--fa); } body.colori .nome.c-fa { fill: var(--fa); }
body.colori .nota.c-sol .testa { fill: var(--sol); } body.colori .nome.c-sol { fill: #2DD4BF; }
body.colori .nota.c-la .testa { fill: var(--la); } body.colori .nome.c-la { fill: #A79BE8; }
body.colori .nota.c-si .testa { fill: var(--si); } body.colori .nome.c-si { fill: #E879B9; }
/* le note scure (sol, la) hanno un bordo chiaro per staccarsi dallo sfondo */
body.colori .nota.c-la .testa, body.colori .nota.c-sol .testa { stroke: rgba(234,242,255,0.55); stroke-width: .5; }
.chip rect { fill: rgba(15,23,42,0.6); stroke: rgba(255,255,255,0.25); stroke-width: 2; transition: fill .2s; }
.chip text { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 24px; text-anchor: middle; dominant-baseline: central; fill: #EAF2FF; }
.chip.batte rect { fill: rgba(255,255,255,0.22); stroke: #fff; }
body.colori .chip.c-do rect { stroke: var(--do); } body.colori .chip.c-re rect { stroke: var(--re); } body.colori .chip.c-mi rect { stroke: var(--mi); }
body.colori .chip.c-fa rect { stroke: var(--fa); } body.colori .chip.c-sol rect { stroke: #2DD4BF; } body.colori .chip.c-la rect { stroke: #A79BE8; } body.colori .chip.c-si rect { stroke: #E879B9; }
.mini { display: inline-block; vertical-align: middle; }
.mini path { fill: #EAF2FF; }


/* ---------- la musica la disegna VexFlow (lezioni-vexflow.js): qui i colori e le luci ---------- */
.vfr path { fill: #EAF2FF; stroke: none; }
.vfr .vf-stem path { fill: none !important; stroke: #EAF2FF; stroke-width: 1.3; }
.nota .vf-notehead path { transition: fill .3s; }
body.colori .nota.c-do .vf-notehead path:not(.glifo-alt) { fill: var(--do); }
body.colori .nota.c-re .vf-notehead path:not(.glifo-alt) { fill: var(--re); }
body.colori .nota.c-mi .vf-notehead path:not(.glifo-alt) { fill: var(--mi); }
body.colori .nota.c-fa .vf-notehead path:not(.glifo-alt) { fill: var(--fa); }
body.colori .nota.c-sol .vf-notehead path:not(.glifo-alt) { fill: var(--sol); }
body.colori .nota.c-la .vf-notehead path:not(.glifo-alt) { fill: var(--la); }
body.colori .nota.c-si .vf-notehead path:not(.glifo-alt) { fill: var(--si); }
body.colori .nota.c-la .vf-notehead path:not(.glifo-alt), body.colori .nota.c-sol .vf-notehead path:not(.glifo-alt) { stroke: rgba(234,242,255,0.55); stroke-width: .5; }
.nota.luce .vf-notehead { filter: drop-shadow(0 0 9px #fff) drop-shadow(0 0 4px #fff); }
.gambo-evid .vf-stem path { stroke: #FDE047; stroke-width: 2; filter: drop-shadow(0 0 6px #FDE047); }
.vfr .glifo-alt.evid { fill: var(--luce, #FDE047) !important; }

/* ---------- IL FOGLIO: il palco è bianco con l'inchiostro nero, come uno spartito vero ----------
   (il cartellino sopra e i pulsanti sotto restano scuri come il resto del sito) */
.palco { background: #FFFFFF; margin: 0 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08); }
.lezione.solo-testo .palco { background: transparent; margin: 0; box-shadow: none; }
.palco .riga, .palco .taglio, .palco .stanghetta { stroke: #1F2937; }
.palco .riga.accesa { stroke: var(--luce, #F59E0B); stroke-width: 9; filter: saturate(1.5) brightness(.88); }
.palco .spazio.acceso { opacity: .42; }
.palco .glifo, .palco .vfr path, .palco .glifo-alt { fill: #111827; }
.palco .vfr .vf-stem path { stroke: #111827; }
.palco .evid, .palco .evid .glifo, .palco .evid.glifo, .palco .vfr .evid { fill: var(--luce, #F59E0B) !important; filter: saturate(1.5) brightness(.85) drop-shadow(0 0 3px rgba(0,0,0,.25)); }
/* teste colorate: un sottile bordo nero, così anche il MI giallo si vede sul bianco */
body.colori .palco .nota[class*="c-"] .vf-notehead path:not(.glifo-alt) { stroke: #111827; stroke-width: .9; }
.palco .nota.luce .vf-notehead { filter: drop-shadow(0 0 5px #F59E0B) drop-shadow(0 0 2px #F59E0B); }
.palco .gambo-evid .vf-stem path { stroke: #E11D48; stroke-width: 2.2; filter: none; }
/* nomi delle note: colori un po' più scuri, con un alone bianco */
.palco .nome { fill: #111827; stroke: #FFFFFF; }
.palco .nome.coperto { fill: #94A3B8; }
body.colori .palco .nome.c-do { fill: #D0103A; } body.colori .palco .nome.c-re { fill: #D97706; } body.colori .palco .nome.c-mi { fill: #A88A00; }
body.colori .palco .nome.c-fa { fill: #4D7C0F; } body.colori .palco .nome.c-sol { fill: #00807A; } body.colori .palco .nome.c-la { fill: #5E50A1; } body.colori .palco .nome.c-si { fill: #B8327F; }
/* scritte, frecce e numeri del disegno */
.palco .etic { fill: #334155; stroke: #FFFFFF; }
.palco .etic[fill], .palco text[fill], .palco .freccia, .palco .esito { filter: saturate(1.4) brightness(.78); }

.palco .conta { fill: #64748B; } .palco .conta.batte { fill: #111827; }

/* ---------- ritmo: figure, barre della durata, legature ---------- */
.fig .glifo { fill: #EAF2FF; }
.fig .testa { fill: #EAF2FF; } .fig .gambo { stroke: #EAF2FF; stroke-width: 2.4; }
.punto { fill: #EAF2FF; }
.trave { fill: #EAF2FF; }
.legatura { fill: none; stroke: #EAF2FF; stroke-width: 4.5; stroke-linecap: round; }
.barra .pezzo { stroke: rgba(15,23,42,0.5); stroke-width: 1.5; }
.barra .pz0 { fill: #7DD3FC; } .barra .pz1 { fill: #FBBF24; } .barra .pz2 { fill: #F472B6; }

/* ---------- musica disegnata da VexFlow (le righe del pentagramma restano nostre) ---------- */
.vfr path { fill: #EAF2FF; stroke: none; }

/* ================= costanti e note ================= */
const S = 32, H = S / 2, K = S / 10;           // spazio fra due righe, mezzo spazio, scala dei glifi
const NOMI = ["do", "re", "mi", "fa", "sol", "la", "si"];
const SEMI = [0, 2, 4, 5, 7, 9, 11];
const BASE = { violino: 30, basso: 18 };        // nota della 1ª riga: mi (violino), sol (basso), in gradi dal do
function nota(chiave, p) {                       // p = posizione: 0 = 1ª riga, 1 = 1° spazio, 2 = 2ª riga...
  const d = BASE[chiave] + p, n = ((d % 7) + 7) % 7, ott = Math.floor(d / 7);
  return { d, nome: NOMI[n], midi: SEMI[n] + 12 * (ott + 1) };
}
const MAIU = s => s.toUpperCase();
const ord = (n, f) => n + (f ? "ª" : "°");
function dovE(p) {                               // descrizione della posizione
  if (p >= 0 && p <= 8) return p % 2 === 0 ? "sulla " + ord(p / 2 + 1, true) + " riga" : "nel " + ord((p + 1) / 2) + " spazio";
  if (p === -1) return "sotto la 1ª riga";
  if (p === 9) return "sopra la 5ª riga";
  if (p < -1) { const t = Math.floor((-p) / 2); return p % 2 === 0 ? "sul " + ord(t) + " taglio sotto" : "sotto il " + ord(t) + " taglio"; }
  const t = Math.floor((p - 8) / 2); return p % 2 === 0 ? "sul " + ord(t) + " taglio sopra" : "sopra il " + ord(t) + " taglio";
}

/* ================= suono (solo quando si tocca qualcosa; nessun microfono) ================= */
let AC = null, master = null, spegniTimer = 0;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function riposo(dopoSec) {                       // il contesto audio va in pausa quando tace
  clearTimeout(spegniTimer);
  spegniTimer = setTimeout(() => { if (AC && AC.state === "running" && !metro.attivo) AC.suspend(); }, (dopoSec + 0.6) * 1000);
}
function suona(midi, quando = 0, dur = 1.1) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + 0.03 + quando, f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  const filtro = ac.createBiquadFilter(); filtro.type = "lowpass"; filtro.frequency.value = Math.min(6000, f * 6);
  [[1, "triangle", 1], [2, "sine", 0.35], [3, "sine", 0.12]].forEach(([m, tipo, v]) => {
    const o = ac.createOscillator(), gg = ac.createGain(); o.type = tipo; o.frequency.value = f * m; gg.gain.value = v;

function svgRigaValore(y, fig, punti, o = {}) {

  let s = `<g class="riga-val ${o.cls || ""}" data-fig="${fig}" data-punti="${punti}"${o.pausa ? ' data-pausa="1"' : ""}>`;
  s += `<rect class="colpo" x="20" y="${y - 36}" width="960" height="72"/>`;
  s += svgFig(o.xf || 95, o.pausa ? y - 6 : y + 8, fig, punti, { k, gambo: 2.6, pausa: o.pausa, cls: "fig-riga" });
  s += `<text class="nome-fig" x="${o.xn || 160}" y="${y + 16}">${nomeFig(fig, punti, o.pausa)}</text>`;
  let parti = [BASE_VAL[fig]]; for (let i = 1; i <= punti; i++) parti.push(parti[i - 1] / 2);
  let x = X;
  s += `<g class="barra${o.pausa ? " silenzio" : ""}">`;
  parti.forEach((v, i) => { s += `<rect class="pezzo pz${i} cresce" x="${x}" y="${y - 8}" width="${Math.max(4, v * U - 4)}" height="30" rx="7"/>`; x += v * U; });
  s += `<rect class="riempi" x="${X}" y="${y - 8}" width="${Math.max(4, x - X - 4)}" height="30" rx="7"/></g>`;
  s += `<text class="val-riga" x="${x + 10}" y="${y + 16}">${num(valore(fig, punti))}</text>`;
  return s + `</g>`;
}
/* fa sentire una figura: suono lungo quanto vale, colpi a ogni movimento, barra che si riempie */
function ascoltaFigura(g, fig, punti, pausa, bpm = 72) {
  fermaTutto();
  const sec = 60 / bpm, d = valore(fig, punti), att = 0.3;
  const ri = g.querySelector(".riempi"); ri.style.transition = "none"; ri.style.transform = "scaleX(0)"; void ri.getBoundingClientRect();
  for (let b = 0; b < Math.max(1, Math.ceil(d - 1e-9)); b++) colpoMetro(b === 0, att + b * sec);
  if (!pausa) suonaTenuto(MI, att, d * sec);
  dopo(att * 1000, () => { salta(g.querySelector(".fig-riga")); ri.style.transition = `transform ${d * sec}s linear`; ri.style.transform = "scaleX(1)"; });
  dopo((att + d * sec + 0.6) * 1000, () => { ri.style.transition = "transform .4s"; ri.style.transform = "scaleX(0)"; });
  cart(`<b>${nomeFig(fig, punti, pausa)}</b> <span class="piccolo">· ${punti ? somma(fig, punti) : num(d)} ${d <= 1 ? "movimento" : "movimenti"}</span>`);
}

function palcoPunto(fig, punti, U = 130) {
  const r = R(60, 340, 260, "violino");
  let s = svgRigo(r, { spazi: true }) + vfRigo({ x0: r.x0, x1: r.x1, yb: r.yb, ev: [{ fig, punti, p: 0, cls: "fig-grande", puntoCls: "punto-big vela nascosto" }], xs: [235] });
  // barre: valore della nota, poi i pezzi dei punti
  let parti = [BASE_VAL[fig]]; for (let k = 1; k <= punti; k++) parti.push(parti[k - 1] / 2);
  let x = 420; const y = 150;
  s += `<g class="barra grande">`;
  parti.forEach((v, k) => { s += `<rect class="pezzo pz${k} cresce${k ? " zero" : ""}" data-k="${k}" x="${x}" y="${y}" width="${Math.max(6, v * U - 6)}" height="56" rx="10"/>` +
    `<text class="val-pezzo vela${k ? " nascosto" : ""}" data-k="${k}" x="${x + (v * U - 6) / 2}" y="${y + 38}">${num(v)}</text>`; x += v * U; });
  s += `<rect class="riempi" x="420" y="${y}" width="${x - 426}" height="56" rx="10"/></g>`;
  s += `<text class="uguale vela nascosto" x="420" y="${y + 120}">${somma(fig, punti)}</text>`;
  s += `<text class="etic" x="420" y="${y - 22}">${MAIU(nomeFig(fig, 0))}${punti ? " + " + (punti === 1 ? "PUNTO" : "DUE PUNTI") : ""}</text>`;
  return s;
}

}

  const nav = $("#indice");
  CAPITOLI.forEach((c, ci) => {
    const g = document.createElement("div"); g.className = "gruppo"; g.style.setProperty("--colore", c.colore);
    const quanti = PASSI.filter(p => p.cap === ci).length; g.style.flex = quanti + " 1 0";
    g.innerHTML = `<div class="cap">${c.nome}</div><div class="pillole"></div>`;
    PASSI.forEach((p, i) => {
      if (p.cap !== ci) return;
      const b = document.createElement("button"); b.className = "pillola"; b.dataset.i = i; b.title = (i + 1) + ". " + p.titolo;
      b.innerHTML = `<span class="n">${i + 1}</span><span class="t">${p.breve}</span>`;
      b.addEventListener("click", () => vai(i, 0));
      g.querySelector(".pillole").appendChild(b);
    });
    nav.appendChild(g);
  });
})();

function vai(i, f = 0, anim = true) {
  fermaTutto();
  if (AC && AC.state === "running") riposo(0);
  const cambia = i !== passo || !PALCO.firstChild;
  passo = i; fase = f; visti.add(i);
  const P = PASSI[i];
  document.documentElement.style.setProperty("--cap", CAPITOLI[P.cap].colore);
  LEZ.classList.toggle("solo-testo", !!P.soloTesto);
  if (cambia) {
    $("#capitolo").textContent = CAPITOLI[P.cap].nome;
    $("#titoloPasso").textContent = P.titolo;
    const ul = $("#punti"); ul.innerHTML = "";
    P.punti.forEach((t, k) => { const li = document.createElement("li"); li.innerHTML = t; li.addEventListener("click", () => vai(passo, k)); ul.appendChild(li); });
    const qd = $("#quaderno"); qd.innerHTML = P.quaderno ? `<div class="tit">📒 Sul quaderno</div>${P.quaderno}` : "";
    P.crea();
  }
  // punti: già visti, quello di adesso, quelli dopo nascosti
  [...$("#punti").children].forEach((li, k) => { li.classList.toggle("ora", k === f); li.classList.toggle("dopo", k > f); });
  $("#quaderno").hidden = !P.quaderno || f < P.punti.length - 1;
  P.fase(f, anim);
  // fasi in basso
  const fs = $("#fasi"); fs.innerHTML = "";
  if (P.punti.length > 1) P.punti.forEach((_, k) => {
    const b = document.createElement("button"); b.textContent = k + 1; b.className = k < f ? "fatta" : k === f ? "ora" : "";
    b.setAttribute("aria-label", "Punto " + (k + 1)); b.addEventListener("click", () => vai(passo, k)); fs.appendChild(b);
  });
  document.querySelectorAll(".pillola").forEach(b => { const n = +b.dataset.i; b.classList.toggle("attiva", n === i); b.classList.toggle("vista", visti.has(n) && n !== i); });
  $("#contatore").textContent = `Passo ${i + 1} di ${PASSI.length}`;
  $("#indietro").disabled = i === 0 && f === 0;
  const ultimo = i === PASSI.length - 1 && f === P.punti.length - 1;
  $("#avanti").disabled = ultimo;
  $("#avanti").innerHTML = f < P.punti.length - 1 ? "Avanti ▶" : (i < PASSI.length - 1 ? "Passo " + (i + 2) + " ▶" : "Fine");
  try { history.replaceState(null, "", "#passo-" + (i + 1)); } catch (e) { }
  adattaTesto();
}
// se il testo del passo non sta nella sua scheda, si rimpicciolisce un poco (mai sotto 15 px)
function adattaTesto() {
  const sp = $(".spiega"); let fs = 20;
  sp.style.removeProperty("--fs"); sp.style.removeProperty("--fq");
  if (getComputedStyle(sp).overflow !== "hidden" || sp.offsetParent === null) return;
  while (sp.scrollHeight > sp.clientHeight + 1 && fs > 15) { fs -= 0.5; sp.style.setProperty("--fs", fs + "px"); sp.style.setProperty("--fq", (fs * 0.78) + "px"); }
}
function avanti() {
  const P = PASSI[passo];
  if (fase < P.punti.length - 1) vai(passo, fase + 1);
  else if (passo < PASSI.length - 1) vai(passo + 1, 0);
}
function indietro() {
  if (fase > 0) vai(passo, fase - 1, false);
  else if (passo > 0) vai(passo - 1, PASSI[passo - 1].punti.length - 1, false);
}
$("#avanti").addEventListener("click", avanti);
$("#indietro").addEventListener("click", indietro);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); avanti(); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); indietro(); }
});
$("#btnColori").addEventListener("click", e => {
  const on = document.body.classList.toggle("colori");
  e.currentTarget.classList.toggle("attivo", on);
});
document.addEventListener("visibilitychange", () => { if (document.hidden) { fermaTutto(); if (AC && AC.state === "running") AC.suspend(); } });

if (document.fonts && document.fonts.ready) document.fonts.ready.then(adattaTesto);
window.addEventListener("resize", () => { cancelAnimationFrame(adattaTesto.t); adattaTesto.t = requestAnimationFrame(adattaTesto); });
const daIndirizzo = parseInt((location.hash.match(/passo-(\d+)/) || [])[1], 10);
vai(daIndirizzo >= 1 && daIndirizzo <= PASSI.length ? daIndirizzo - 1 : 0, 0, true);
</script>
<script src="adatta-schermo.js" data-schermate="#lezione"></script>

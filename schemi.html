<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Nome del sito: musicascuole.it (nessuna intestazione visibile a schermo, il nome resta solo qui e nel <title>) -->
<title>Schemi — musicascuole.it</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Vari schemi per le note musicali, gli accordi e altro.">

<!--
  ============================================================
  PAGINA SCHEMI — una card per ogni gruppo di schemi.
  "Strumenti" porta a schemi-strumenti.html.
  ============================================================
-->

<link rel="stylesheet" href="comune.css">
<link rel="stylesheet" href="sito.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="freccia" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="barra-alta contenitore">
  <a class="casa" href="index.html" aria-label="Torna alla pagina principale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>musicascuole.it</a>
</div>

<header class="contenitore">
  <div class="lamella-titolo" style="--col: var(--fa); --su-col: #141B3C;">
    <span class="tasto"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-schemi"/></svg></span>
    <div><h1>Schemi</h1><p>Vari schemi per le note musicali, gli accordi e altro.</p></div>
  </div>
</header>

<main class="contenitore">
  <section class="sezione" aria-label="Elenco degli schemi">
    <ul class="elenco" id="grid"></ul>
  </section>
</main>

<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>

<script>
  /* ============================================================
     ELENCO — per aggiungerne uno, copia un blocco { ... }
     ============================================================ */
  const elenco = [
    {
      title: "Strumenti",
      icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-strumenti"/></svg>',
      desc: "Flauto dolce, chitarra, ukulele, tastiera e basso elettrico: note e accordi.",
      url: "schemi-strumenti.html"
    }
  ];

  const FRECCIA = '<svg class="freccia" aria-hidden="true"><use href="#freccia"/></svg>';
  /* una riga dell'elenco: icona su tasto scuro, titolo, descrizione */
  function voce(t) {
    const li = document.createElement('li');
    li.innerHTML = `
      <a class="voce" href="${t.url}">
        <span class="tasto">${t.icon}</span>
        <span class="testo"><h3>${t.title}</h3>${t.desc ? `<p>${t.desc}</p>` : ''}${t.label ? `<span class="tipo"><i></i>${t.label}</span>` : ''}</span>
        ${FRECCIA}
      </a>`;
    return li;
  }
  const grid = document.getElementById('grid');
  elenco.forEach(t => grid.appendChild(voce(t)));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Nome del sito: musicascuole.it (nessuna intestazione visibile a schermo, il nome resta solo qui e nel <title>) -->
<title>Giochi — musicascuole.it</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Giochi musicali da fare da soli o a squadre: Note-UNO e memory.">

<!--
  ============================================================
  PAGINA GIOCHI — per aggiungere un gioco: carica il file .html
  nella cartella principale e aggiungi un blocco { ... }
  all'elenco "giochi" in fondo alla pagina.
  ============================================================
-->

<link rel="stylesheet" href="comune.css">
<link rel="stylesheet" href="sito.css">
<style>
  .voce .tipo i { background: var(--re); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="freccia" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="barra-alta contenitore">
  <a class="casa" href="index.html" aria-label="Torna alla pagina principale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h4.5v-5h3v5H18V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>musicascuole.it</a>
</div>

<header class="contenitore">
  <div class="lamella-titolo" style="--col: var(--re); --su-col: #141B3C;">
    <span class="tasto"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-giochi"/></svg></span>
    <div><h1>Giochi</h1><p>Note-UNO e memory, anche a squadre.</p></div>
  </div>
</header>

<main class="contenitore">
  <section class="sezione" aria-label="Elenco dei giochi">
    <ul class="elenco" id="grid"></ul>
  </section>
</main>

<footer class="piede">Cristiano Arata · musicascuole.it — <a href="crediti.html">Crediti e licenza</a> · <a href="privacy.html">Privacy</a></footer>

<script>
  /* ============================================================
     ELENCO — per aggiungerne uno, copia un blocco { ... }
     ============================================================ */
  const giochi = [
    {
      title: "Note-UNO",
      icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-note-uno"/></svg>',
      label: "Note",
      desc: "Un gioco di carte in stile UNO per allenarsi con le note musicali.",
      url: "note-uno.html"
    },
    {
      title: "Memory delle Note",
      icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-memory-note"/></svg>',
      label: "Note",
      desc: "Trova le coppie: nota e nome, due note uguali o la stessa nota in due chiavi. Da 1 a 4 giocatori.",
      url: "memory-note.html"
    },
    {
      title: "Memory degli Strumenti",
      icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-memory-strumenti"/></svg>',
      label: "Strumenti",
      desc: "Trova le coppie di foto, nomi e suoni degli strumenti dell'orchestra. Da 1 a 4 giocatori.",
      url: "memory-strumenti.html"
    }
  ];

  const FRECCIA = '<svg class="freccia" aria-hidden="true"><use href="#freccia"/></svg>';
  /* una riga dell'elenco: icona su tasto scuro, titolo, descrizione */
  function voce(t) {
    const li = document.createElement('li');
    li.innerHTML = `
      <a class="voce" href="${t.url}">
        <span class="tasto">${t.icon}</span>
        <span class="testo"><h3>${t.title}</h3>${t.desc ? `<p>${t.desc}</p>` : ''}${t.label ? `<span class="tipo"><i></i>${t.label}</span>` : ''}</span>
        ${FRECCIA}
      </a>`;
    return li;
  }
  const grid = document.getElementById('grid');
  giochi.forEach(t => grid.appendChild(voce(t)));
</script>
</body>
</html>

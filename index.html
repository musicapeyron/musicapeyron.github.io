<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Nome del sito: Musica Peyron (nessuna intestazione visibile a schermo, il nome resta solo qui e nel <title>) -->
<title>Musica Peyron</title>
<meta name="description" content="Raccolta di giochi didattici di educazione musicale.">

<!--
  ============================================================
  COME AGGIUNGERE UN NUOVO GIOCO/STRUMENTO
  ============================================================
  1) Carica il file .html del gioco nella stessa cartella di
     questa pagina (accanto a musica-peyron.html).
  2) Aggiungi un nuovo blocco { ... } dentro l'array "tools"
     qui sotto, nel tag <script>: titolo, descrizione breve,
     etichetta (es. "Teoria", "Ritmo"), un'emoji e "url" col
     nome del file appena caricato.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #EAF2FF;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 12% 8%, #1c4d7c 0%, transparent 32%),
      radial-gradient(circle at 88% 92%, #14345e 0%, transparent 36%),
      linear-gradient(160deg, #050a16 0%, #0b1c38 48%, #0e2a4d 100%);
    overflow-x: hidden;
  }

  /* ---------- hero ---------- */
  header.hero {
    max-width: 620px;
    margin: 0 auto;
    padding: 44px 24px 28px;
    text-align: center;
  }

  header.hero h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.2;
    margin: 0 0 8px;
    letter-spacing: -0.015em;
  }

  header.hero p {
    font-size: 14px;
    color: #9FB3CE;
    font-weight: 500;
    line-height: 1.5;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ---------- staff line signature ---------- */
  .staff {
    max-width: 340px;
    margin: 24px auto 0;
    height: 28px;
    position: relative;
  }
  .staff svg { width: 100%; height: 100%; display: block; }
  .staff line {
    stroke: rgba(255,255,255,0.14);
    stroke-width: 1;
  }
  .staff circle {
    fill: #5EC8D8;
  }
  .staff .note-path {
    animation: travel 7s linear infinite;
  }
  @keyframes travel {
    0%   { transform: translateX(0); }
    100% { transform: translateX(300px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .staff .note-path { animation: none; }
  }

  /* ---------- tools grid ---------- */
  main {
    max-width: 940px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }

  .card {
    position: relative;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 16px 16px 14px;
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    display: flex;
    flex-direction: column;
    min-height: 148px;
  }

  .card:hover {
    border-color: rgba(94, 200, 216, 0.45);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
  }

  .card .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card .icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: rgba(94, 200, 216, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .card .label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #7FD8E4;
    background: rgba(94, 200, 216, 0.1);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    margin: 0 0 5px;
    letter-spacing: -0.01em;
  }

  .card p {
    font-size: 12.5px;
    line-height: 1.45;
    color: #9FB3CE;
    font-weight: 500;
    margin: 0 0 12px;
    flex: 1;
  }

  .card a.open {
    align-self: flex-start;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    color: #061323;
    background: #EAF2FF;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .card a.open:hover {
    background: #5EC8D8;
    transform: translateX(2px);
  }

  /* empty slot */
  .card.empty {
    align-items: center;
    justify-content: center;
    text-align: center;
    border-style: dashed;
    background: transparent;
    color: #64789A;
    min-height: 148px;
  }
  .card.empty:hover { transform: none; border-color: rgba(255,255,255,0.14); }
  .card.empty .plus {
    font-family: 'Manrope', sans-serif;
    font-size: 20px;
    color: #5EC8D8;
    margin-bottom: 3px;
  }
  .card.empty div:last-child {
    font-size: 12px;
  }

  footer {
    text-align: center;
    padding: 0 20px 32px;
    font-size: 11.5px;
    color: #5C7091;
  }
</style>
</head>
<body>

<header class="hero">
  <h1>Piccoli strumenti per imparare la musica.</h1>
  <p>Esercizi interattivi per allenare orecchio, teoria e ritmo un passo alla volta.</p>

  <div class="staff" aria-hidden="true">
    <svg viewBox="0 0 340 28" preserveAspectRatio="none">
      <line x1="0" y1="6"  x2="340" y2="6"></line>
      <line x1="0" y1="12" x2="340" y2="12"></line>
      <line x1="0" y1="18" x2="340" y2="18"></line>
      <line x1="0" y1="24" x2="340" y2="24"></line>
      <line x1="0" y1="30" x2="340" y2="30"></line>
      <g class="note-path">
        <circle cx="5" cy="12" r="3.2"></circle>
      </g>
    </svg>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>una raccolta personale di esercizi musicali</footer>

<script>
  /* ============================================================
     I TUOI STRUMENTI / GIOCHI — modifica qui
     ============================================================ */
  const tools = [
    {
      title: "Le Note sul Pianoforte",
      icon: "🎹",
      label: "Teoria",
      desc: "Riconosci le note sulla tastiera, tasto dopo tasto.",
      url: "tastierapianoforte.html"
    },
    {
      title: "Leggi la Nota",
      icon: "🎵",
      label: "Teoria",
      desc: "Impara a leggere le note sul pentagramma, una alla volta.",
      url: "leggi-la-nota.html"
    },
    {
      title: "Acuto o Grave?",
      icon: "👂",
      label: "Ascolto",
      desc: "Allena l'orecchio a distinguere i suoni acuti dai gravi.",
      url: "acuto-o-grave.html"
    },
    {
      title: "Figure Ritmiche",
      icon: "🎼",
      label: "Ritmo",
      desc: "Riconosci nomi, pause e valori delle figure musicali.",
      url: "figure-ritmiche.html"
    },
    {
      title: "Costruttore di Battute",
      icon: "🥁",
      label: "Ritmo",
      desc: "Componi battute scegliendo e disponendo le figure ritmiche.",
      url: "costruttore-di-battute.html"
    },
    {
      title: "Le Qualità del Suono",
      icon: "🌊",
      label: "Teoria",
      desc: "Esplora altezza, intensità, timbro e come viaggia un'onda sonora.",
      url: "qualita-del-suono.html"
    },
    {
      title: "Nomina gli Intervalli",
      icon: "📏",
      label: "Teoria",
      desc: "Riconosci e nomina gli intervalli musicali sul pentagramma.",
      url: "nomina-intervalli.html"
    },
    {
      title: "Ascolta gli Intervalli",
      icon: "👂",
      label: "Ascolto",
      desc: "Allena l'orecchio a riconoscere gli intervalli, ascendenti o discendenti.",
      url: "ascolta-intervalli.html"
    }
  ];

  const grid = document.getElementById('grid');

  tools.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top-row">
        <div class="icon">${t.icon}</div>
        <span class="label">${t.label}</span>
      </div>
      <h2>${t.title}</h2>
      <p>${t.desc}</p>
      <a class="open" href="${t.url}">Apri →</a>
    `;
    grid.appendChild(card);
  });

  const empty = document.createElement('div');
  empty.className = 'card empty';
  empty.innerHTML = `<div class="plus">+</div><div>Prossimo strumento in arrivo</div>`;
  grid.appendChild(empty);
</script>

</body>
</html>

<!--
  ============================================================
  COME AGGIUNGERE UN NUOVO GIOCO/STRUMENTO
  ============================================================
  1) Carica il file .html del gioco nella stessa cartella di
     questa pagina (accanto a index.html).
  2) Aggiungi un nuovo blocco { ... } dentro l'array "tools"
     qui sotto, nel tag <script>: titolo, descrizione breve,
     etichetta (es. "Teoria", "Ritmo"), un'emoji e "url" col
     nome del file appena caricato.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #EAF2FF;
    -webkit-font-smoothing: antialiased;
    background: #0f172a;
    overflow-x: hidden;
    position: relative;
  }
  /* Sfondo su uno strato fisso: stesso aspetto dello sfondo "fissato",
     ma il telefono non deve ridisegnarlo mentre si scorre la pagina */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, #3730a3 0%, transparent 45%),
      linear-gradient(135deg, #0f172a, #1e1b4b);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* ---------- hero ---------- */
  header.hero {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 24px 16px;
    text-align: center;
  }

  header.hero h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 25px;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.015em;
    /* sempre su una riga: su schermi stretti il testo si rimpicciolisce (vedi fitTitle) */
    white-space: nowrap;
  }
  @media (max-width: 600px) {
    header.hero { padding-left: 12px; padding-right: 12px; max-width: none; }
    header.hero h1 { font-size: 20px; }
  }

  /* parola "la" del titolo: identica al resto del testo, nessun indizio visivo */
  header.hero h1 {
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  #secretLa {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  header.hero p {
    font-size: 12.5px;
    color: #9FB3CE;
    font-weight: 500;
    line-height: 1.45;
    max-width: 380px;
    margin: 0 auto;
  }

  /* ---------- staff line signature ---------- */
  .staff {
    max-width: 300px;
    margin: 18px auto 8px;
    height: 32px;
    position: relative;
  }
  .staff svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .staff line {
    stroke: rgba(255,255,255,0.14);
    stroke-width: 1;
  }
  /* La notina "cammina" sul rigo a scatti, suonando una scala
     mi-fa-sol-la-si-do-re-mi e ritorno, con i colori ufficiali delle note.
     A scatti (2 al secondo) invece che fluida: il telefono ridisegna
     2 volte al secondo invece di 60, quindi non scalda e consuma pochissimo. */
  /* chiave di violino: forma presa da VexFlow, la stessa degli esercizi */
  .staff .clef { fill: rgba(255,255,255,0.42); }
  .staff .melody-note {
    transform: translate(32px, 31px);
    fill: #FFF428;
    /* contorno chiaro sottile: il colore resta quello della nota,
       ma si stacca dallo sfondo (serve soprattutto al la, viola su viola) */
    stroke: rgba(255,255,255,0.7);
    stroke-width: 0.9;
    animation: melody 7s step-end infinite;
  }
  @keyframes melody {
    0.0% { transform: translate(32.0px, 31px); fill: #FFF428; }
    7.143% { transform: translate(51.8px, 27.75px); fill: #BED958; }
    14.286% { transform: translate(71.7px, 24.5px); fill: #009C95; }
    21.429% { transform: translate(91.5px, 21.25px); fill: #5E50A1; }
    28.571% { transform: translate(111.4px, 18px); fill: #CF3E96; }
    35.714% { transform: translate(131.2px, 14.75px); fill: #E21C48; }
    42.857% { transform: translate(151.1px, 11.5px); fill: #F99D1C; }
    50.0% { transform: translate(170.9px, 8.25px); fill: #FFF428; }
    57.143% { transform: translate(190.8px, 11.5px); fill: #F99D1C; }
    64.286% { transform: translate(210.6px, 14.75px); fill: #E21C48; }
    71.429% { transform: translate(230.5px, 18px); fill: #CF3E96; }
    78.571% { transform: translate(250.3px, 21.25px); fill: #5E50A1; }
    85.714% { transform: translate(270.2px, 24.5px); fill: #009C95; }
    92.857% { transform: translate(290.0px, 27.75px); fill: #BED958; }
  }
  @media (prefers-reduced-motion: reduce) {
    .staff .melody-note { animation: none; }
  }

  /* ---------- tools grid ---------- */
  main {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }

  /* ---------- card in evidenza: Spartiti ---------- */
  .featured-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(94,200,216,0.12), rgba(255,255,255,0.035));
    border: 1px solid rgba(94,200,216,0.35);
    border-radius: 14px;
    padding: 14px 18px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 16px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .featured-card:hover {
    border-color: rgba(94,200,216,0.6);
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(94,200,216,0.18), rgba(255,255,255,0.05));
  }
  .featured-card .icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: rgba(94, 200, 216, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .featured-card .featured-text { flex: 1; }
  .featured-card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .featured-card p {
    font-size: 11.5px;
    color: #9FB3CE;
    font-weight: 500;
    margin: 0;
  }
  .featured-card .arrow {
    font-size: 16px;
    color: #7FD8E4;
    flex-shrink: 0;
  }

  .featured-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 16px;
  }
  .featured-row .featured-card { margin-bottom: 0; }
  @media (max-width: 600px) { .featured-row { grid-template-columns: 1fr; } }
  .featured-giochi {
    background: linear-gradient(135deg, rgba(249,157,28,0.14), rgba(255,255,255,0.035));
    border-color: rgba(249,157,28,0.4);
  }
  .featured-giochi:hover { border-color: rgba(249,157,28,0.65); background: linear-gradient(135deg, rgba(249,157,28,0.2), rgba(255,255,255,0.05)); }
  .featured-giochi .icon { background: rgba(249,157,28,0.18); }
  .featured-giochi .arrow { color: #F99D1C; }
  .featured-schemi {
    background: linear-gradient(135deg, rgba(190,217,88,0.13), rgba(255,255,255,0.035));
    border-color: rgba(190,217,88,0.4);
  }
  .featured-schemi:hover { border-color: rgba(190,217,88,0.65); background: linear-gradient(135deg, rgba(190,217,88,0.19), rgba(255,255,255,0.05)); }
  .featured-schemi .icon { background: rgba(190,217,88,0.18); }
  .featured-schemi .arrow { color: #BED958; }

  /* ---------- livelli: P M L ---------- */
  .lv {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 5px;
    font-family: 'Manrope', sans-serif; font-size: 10px; font-weight: 800;
    color: rgba(234,242,255,0.28); border: 1px solid rgba(234,242,255,0.14);
  }
  .lv.on { color: #0f172a; border-color: transparent; }
  .lv-P.on { background: #f9a8d4; }
  .lv-M.on { background: #fcd34d; }
  .lv-L.on { background: #93c5fd; }
  .card .livelli { display: flex; gap: 3px; margin-top: 8px; }

  .livelli-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin: 0 0 14px;
  }
  .livelli-bar .bar-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #9FB3CE; margin-right: 4px;
  }
  .livelli-bar button {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12.5px;
    color: #EAF2FF; cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05);
  }
  .livelli-bar button:hover { background: rgba(255,255,255,0.12); }
  .livelli-bar .corto { display: none; }
  @media (max-width: 600px) {
    .livelli-bar { gap: 4px; flex-wrap: nowrap; }
    .livelli-bar .bar-label { display: none; }
    .livelli-bar .lungo { display: none; }
    .livelli-bar .corto { display: inline; }
    .livelli-bar button { font-size: 12px; padding: 6px 10px; gap: 5px; flex-shrink: 0; }
  }
  @media (max-width: 360px) { .livelli-bar button { font-size: 11px; padding: 5px 8px; } }
  .livelli-bar button.active { background: #EAF2FF; color: #0f172a; border-color: #EAF2FF; }

  /* Test d'ingresso: card a parte, larga e di un altro colore */
  #testWrap { margin-bottom: 18px; }
  #testWrap .card-test {
    display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 14px;
    align-items: center; min-height: 0; padding: 14px 18px;
    background: linear-gradient(135deg, rgba(249,168,212,0.16), rgba(252,211,77,0.10));
    border: 1px solid rgba(249,168,212,0.45);
  }
  #testWrap .card-test:hover { border-color: rgba(249,168,212,0.75); }
  #testWrap .card-test .top-row { grid-row: 1 / span 2; margin: 0; }
  #testWrap .card-test .top-row .label { display: none; }
  #testWrap .card-test .icon { width: 34px; height: 34px; font-size: 16px; background: rgba(249,168,212,0.2); }
  #testWrap .card-test h2 { grid-column: 2; margin: 0; font-size: 15.5px; }
  #testWrap .card-test p { grid-column: 2; margin: 2px 0 0; }
  #testWrap .card-test .livelli { grid-column: 3; grid-row: 1 / span 2; margin: 0; }
  [hidden] { display: none !important; }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.09);
    margin: 0 0 16px;
  }

  /* ---------- sezioni ---------- */
  .group { margin-top: 22px; }
  .group:first-of-type { margin-top: 4px; }
  .group-title {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Manrope', sans-serif; font-weight: 800;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #cbd5e1; margin: 0 0 10px; padding-left: 10px;
    border-left: 3px solid var(--accent);
  }
  .group-giochi    { --accent: #F99D1C; }
  .group-base      { --accent: #5EC8D8; }
  .group-avanzati  { --accent: #a78bfa; }
  .group .card, .group .card:hover { border-top: 2px solid var(--accent); }
  .group .card .label { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .group-giochi .card { background: linear-gradient(180deg, rgba(249,157,28,0.08), rgba(255,255,255,0.03)); }

  .card {
    position: relative;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 11px 12px 11px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    display: flex;
    flex-direction: column;
    /* tutta la card è il link al gioco */
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid #5EC8D8; outline-offset: 2px; }

  .card:hover {
    border-color: rgba(94, 200, 216, 0.45);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
  }

  .card .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .card .icon {
    width: 25px;
    height: 25px;
    border-radius: 7px;
    background: rgba(94, 200, 216, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .card .label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #7FD8E4;
    background: rgba(94, 200, 216, 0.1);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .card p {
    font-size: 11px;
    line-height: 1.4;
    color: #9FB3CE;
    font-weight: 500;
    margin: 0;
    flex: 1;
  }

  /* empty slot */
  .card.empty {
    align-items: center;
    justify-content: center;
    text-align: center;
    border-style: dashed;
    background: transparent;
    color: #64789A;
    cursor: default;
  }
  .card.empty:hover { transform: none; border-color: rgba(255,255,255,0.14); }
  .card.empty .plus {
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    color: #5EC8D8;
    margin-bottom: 2px;
  }
  .card.empty div:last-child {
    font-size: 10.5px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 20px 22px;
    font-size: 10.5px;
    color: #5C7091;
  }
  .ico { width: 84%; height: 84%; display: block; overflow: visible; }
  /* riquadro delle icone nelle card dei giochi: più grande, per le icone disegnate */
  .card .icon { width: 34px !important; height: 34px !important; border-radius: 9px !important; }
  .featured-card .icon .ico { width: 78%; height: 78%; }
</style>
</head>
<body>

  <div class="staff" aria-hidden="true">
    <svg viewBox="0 0 300 32" preserveAspectRatio="none">
      <line x1="0" y1="5"  x2="300" y2="5"></line>
      <line x1="0" y1="11.5" x2="300" y2="11.5"></line>

<script>
  /* ============================================================
     I TUOI STRUMENTI / GIOCHI — modifica qui
     ============================================================ */
  /* Due gruppi, mostrati in sezioni separate:
     - base:    suono, note e ritmo
     - avanzati: da "Nomina gli Intervalli" in poi
     (i giochi sono nella pagina giochi.html) */


  /* il Test d'ingresso ha una card tutta sua, sopra le sezioni */
  const test =
  {
      title: "Test d'Ingresso",
      icon: '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="icone.svg#ic-test"/></svg>',
      label: "Verifica",
      desc: "Una versione breve di quattro giochi didattici, per testare le conoscenze di partenza.",
      livelli: ["P", "M"],
      url: "test-ingresso.html"
  };

    let clicks = 0, timer = null;
    target.addEventListener('click', () => {
      clicks++;
      clearTimeout(timer);
      timer = setTimeout(() => { clicks = 0; }, WINDOW_MS);
      if (clicks >= NEEDED) {
        clicks = 0;
        window.location.href = 'programma/programma-m1cekg1q.html';
      }
    });
  })();

  /* Titolo su una sola riga: se non ci sta, riduce la dimensione del testo
     quanto basta (dipende dalla larghezza dello schermo e dal carattere caricato) */
  function fitTitle() {
    const h1 = document.querySelector('header.hero h1');
    h1.style.fontSize = '';
    let size = parseFloat(getComputedStyle(h1).fontSize);
    while (h1.scrollWidth > h1.clientWidth && size > 11) {
      size -= 0.5;
      h1.style.fontSize = size + 'px';
    }
  }
  fitTitle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  window.addEventListener('resize', fitTitle);

  /* ---------- livelli: P primaria, M medie, L liceo musicale ---------- */
  const LIVELLI = [
    { id: "P", nome: "Primaria",       chiave: "primaria" },
    { id: "M", nome: "Medie",          chiave: "medie" },
    { id: "L", nome: "Liceo musicale", corto: "Liceo", chiave: "liceo" }
  ];
  const segniLivello = lv => '<span class="livelli" aria-label="Adatto a: ' +
    LIVELLI.filter(l => lv.includes(l.id)).map(l => l.nome).join(', ') + '">' +
    LIVELLI.filter(l => lv.includes(l.id)).map(l => `<span class="lv lv-${l.id} on">${l.id}</span>`).join('') + '</span>';

  function creaCard(t, classe) {
    const card = document.createElement('a');
    card.className = 'card' + (classe ? ' ' + classe : '');
    card.href = t.url;
    card.dataset.livelli = t.livelli.join('');
    card.innerHTML = `
      <div class="top-row">
        <div class="icon">${t.icon}</div>
        <span class="label">${t.label}</span>
      </div>
      <h2>${t.title}</h2>
      <p>${t.desc}</p>
      ${segniLivello(t.livelli)}
    `;
    return card;
  }
  function fillGrid(id, list, withEmpty) {
    const grid = document.getElementById(id);
    list.forEach(t => grid.appendChild(creaCard(t)));
    if (withEmpty) {
      const empty = document.createElement('div');
      empty.className = 'card empty';
      empty.innerHTML = `<div class="plus">+</div><div>Prossimo strumento in arrivo</div>`;
      grid.appendChild(empty);
    }
  }

  /* ---------- filtro "Per chi è": si ricorda la scelta e si può condividere
     con un indirizzo, es. index.html?livello=primaria ---------- */
  const barra = document.getElementById('livelliBar');
  barra.innerHTML =
    '<button type="button" data-l="">Tutti</button>' +
    LIVELLI.map(l => `<button type="button" data-l="${l.id}"><span class="lv lv-${l.id} on">${l.id}</span><span class="lungo">${l.nome}</span><span class="corto">${l.corto || l.nome}</span></button>`).join('');
  function applicaLivello(id, salva) {
    barra.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.l === id));
    document.querySelectorAll('a.card[data-livelli]').forEach(c => { c.hidden = !!id && !c.dataset.livelli.includes(id); });
    document.querySelectorAll('.card.empty').forEach(c => { c.hidden = !!id; });
    document.querySelectorAll('main section.group').forEach(sec => { sec.hidden = !sec.querySelector('a.card:not([hidden])'); });
    if (salva) {
      const url = new URL(location.href);
      const l = LIVELLI.find(x => x.id === id);
      if (l) url.searchParams.set('livello', l.chiave); else url.searchParams.delete('livello');
      history.replaceState(null, '', url);
    }
  }
  barra.querySelectorAll('button').forEach(b => b.addEventListener('click', () => applicaLivello(b.dataset.l, true)));
  (function () {
    const daUrl = new URL(location.href).searchParams.get('livello');
    const l = LIVELLI.find(x => x.chiave === daUrl);
    // all'apertura è sempre selezionato "Tutti", salvo un link del tipo index.html?livello=primaria
    applicaLivello(l ? l.id : '', false);
  })();

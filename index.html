<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #EAF2FF;
    -webkit-font-smoothing: antialiased;
    background: #0f172a;
    overflow-x: hidden;
    position: relative;
  }
  /* Sfondo su uno strato fisso: stesso aspetto dello sfondo "fissato",
     ma il telefono non deve ridisegnarlo mentre si scorre la pagina */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 0%, #3730a3 0%, transparent 45%),
      linear-gradient(135deg, #0f172a, #1e1b4b);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* ---------- hero ---------- */
  header.hero {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 24px 16px;
    text-align: center;
  }

  header.hero h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 25px;
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.015em;
    /* sempre su una riga: su schermi stretti il testo si rimpicciolisce (vedi fitTitle) */
    white-space: nowrap;
  }
  @media (max-width: 600px) {
    header.hero { padding-left: 12px; padding-right: 12px; max-width: none; }
    header.hero h1 { font-size: 20px; }
  }

  /* parola "la" del titolo: identica al resto del testo, nessun indizio visivo */
  header.hero h1 {
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  #secretLa {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  header.hero p {
    font-size: 12.5px;
    color: #9FB3CE;
    font-weight: 500;
    line-height: 1.45;
    max-width: 380px;
    margin: 0 auto;
  }

  /* ---------- staff line signature ---------- */
  .staff {
    max-width: 300px;
    margin: 18px auto 8px;
    height: 32px;
    position: relative;
  }
  .staff svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .staff line {
    stroke: rgba(255,255,255,0.14);
    stroke-width: 1;
  }
  /* La notina "cammina" sul rigo a scatti, suonando una scala
     mi-fa-sol-la-si-do-re-mi e ritorno, con i colori ufficiali delle note.
     A scatti (2 al secondo) invece che fluida: il telefono ridisegna
     2 volte al secondo invece di 60, quindi non scalda e consuma pochissimo. */
  /* chiave di violino: forma presa da VexFlow, la stessa degli esercizi */
  .staff .clef { fill: rgba(255,255,255,0.42); }
  .staff .melody-note {
    transform: translate(32px, 31px);
    fill: #FFF428;
    /* contorno chiaro sottile: il colore resta quello della nota,
       ma si stacca dallo sfondo (serve soprattutto al la, viola su viola) */
    stroke: rgba(255,255,255,0.7);
    stroke-width: 0.9;
    animation: melody 7s step-end infinite;
  }
  @keyframes melody {
    0.0% { transform: translate(32.0px, 31px); fill: #FFF428; }
    7.143% { transform: translate(51.8px, 27.75px); fill: #BED958; }
    14.286% { transform: translate(71.7px, 24.5px); fill: #009C95; }
    21.429% { transform: translate(91.5px, 21.25px); fill: #5E50A1; }
    28.571% { transform: translate(111.4px, 18px); fill: #CF3E96; }
    35.714% { transform: translate(131.2px, 14.75px); fill: #E21C48; }
    42.857% { transform: translate(151.1px, 11.5px); fill: #F99D1C; }
    50.0% { transform: translate(170.9px, 8.25px); fill: #FFF428; }
    57.143% { transform: translate(190.8px, 11.5px); fill: #F99D1C; }
    64.286% { transform: translate(210.6px, 14.75px); fill: #E21C48; }
    71.429% { transform: translate(230.5px, 18px); fill: #CF3E96; }
    78.571% { transform: translate(250.3px, 21.25px); fill: #5E50A1; }
    85.714% { transform: translate(270.2px, 24.5px); fill: #009C95; }
    92.857% { transform: translate(290.0px, 27.75px); fill: #BED958; }
  }
  @media (prefers-reduced-motion: reduce) {
    .staff .melody-note { animation: none; }
  }

  /* ---------- tools grid ---------- */
  main {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }

  /* ---------- card in evidenza: Spartiti ---------- */
  .featured-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, rgba(94,200,216,0.12), rgba(255,255,255,0.035));
    border: 1px solid rgba(94,200,216,0.35);
    border-radius: 14px;
    padding: 14px 18px;
    text-decoration: none;
    color: inherit;
    margin-bottom: 16px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .featured-card:hover {
    border-color: rgba(94,200,216,0.6);
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(94,200,216,0.18), rgba(255,255,255,0.05));
  }
  .featured-card .icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: rgba(94, 200, 216, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .featured-card .featured-text { flex: 1; }
  .featured-card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .featured-card p {
    font-size: 11.5px;
    color: #9FB3CE;
    font-weight: 500;
    margin: 0;
  }
  .featured-card .arrow {
    font-size: 16px;
    color: #7FD8E4;
    flex-shrink: 0;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.09);
    margin: 0 0 16px;
  }

  /* ---------- sezioni ---------- */
  .group { margin-top: 22px; }
  .group:first-of-type { margin-top: 4px; }
  .group-title {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Manrope', sans-serif; font-weight: 800;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #cbd5e1; margin: 0 0 10px; padding-left: 10px;
    border-left: 3px solid var(--accent);
  }
  .group-giochi    { --accent: #F99D1C; }
  .group-base      { --accent: #5EC8D8; }
  .group-avanzati  { --accent: #a78bfa; }
  .group .card, .group .card:hover { border-top: 2px solid var(--accent); }
  .group .card .label { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .group-giochi .card { background: linear-gradient(180deg, rgba(249,157,28,0.08), rgba(255,255,255,0.03)); }

  .card {
    position: relative;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 11px 12px 11px;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    display: flex;
    flex-direction: column;
    /* tutta la card è il link al gioco */
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid #5EC8D8; outline-offset: 2px; }

  .card:hover {
    border-color: rgba(94, 200, 216, 0.45);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
  }

  .card .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .card .icon {
    width: 25px;
    height: 25px;
    border-radius: 7px;
    background: rgba(94, 200, 216, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .card .label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #7FD8E4;
    background: rgba(94, 200, 216, 0.1);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .card p {
    font-size: 11px;
    line-height: 1.4;
    color: #9FB3CE;
    font-weight: 500;
    margin: 0;
    flex: 1;
  }

  /* empty slot */
  .card.empty {
    align-items: center;
    justify-content: center;
    text-align: center;
    border-style: dashed;
    background: transparent;
    color: #64789A;
    cursor: default;
  }
  .card.empty:hover { transform: none; border-color: rgba(255,255,255,0.14); }
  .card.empty .plus {
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    color: #5EC8D8;
    margin-bottom: 2px;
  }
  .card.empty div:last-child {
    font-size: 10.5px;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 20px 22px;
    font-size: 10.5px;
    color: #5C7091;
  }
</style>
</head>

  /* Accesso nascosto: 6 clic ravvicinati sulla parola "la" del titolo */

      clicks++;
      clearTimeout(timer);
      timer = setTimeout(() => { clicks = 0; }, WINDOW_MS);
      if (clicks >= NEEDED) {
        clicks = 0;
        window.location.href = 'programma/programma-m1cekg1q.html';
      }
    });
  })();

  function fillGrid(id, list, withEmpty) {
    /* Titolo su una sola riga: se non ci sta, riduce la dimensione del testo
     quanto basta (dipende dalla larghezza dello schermo e dal carattere caricato) */
  function fitTitle() {
    const h1 = document.querySelector('header.hero h1');
    h1.style.fontSize = '';
    let size = parseFloat(getComputedStyle(h1).fontSize);
    while (h1.scrollWidth > h1.clientWidth && size > 11) {
      size -= 0.5;
      h1.style.fontSize = size + 'px';
    }
  }
  fitTitle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  window.addEventListener('resize', fitTitle);

    const grid = document.getElementById(id);
    list.forEach(t => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = t.url;
      card.innerHTML = `
        <div class="top-row">
          <div class="icon">${t.icon}</div>
          <span class="label">${t.label}</span>
        </div>
        <h2>${t.title}</h2>
        <p>${t.desc}</p>
      `;
      grid.appendChild(card);
    });
    if (withEmpty) {
      const empty = document.createElement('div');
      empty.className = 'card empty';
      empty.innerHTML = `<div class="plus">+</div><div>Prossimo strumento in arrivo</div>`;
      grid.appendChild(empty);
    }
  }
  fillGrid('grid-giochi', giochi, false);
  fillGrid('grid-base', base, false);
  fillGrid('grid-avanzati', avanzati, true);
</script>

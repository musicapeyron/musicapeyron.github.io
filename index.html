<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Nome del sito: Musica Peyron (nessuna intestazione visibile a schermo, il nome resta solo qui e nel <title>) -->
<title>Musica Peyron</title>
<meta name="description" content="Raccolta di giochi didattici di educazione musicale.">

<!--
  ============================================================
  COME AGGIUNGERE UN NUOVO GIOCO/STRUMENTO
  ============================================================
  1) Carica il file .html del gioco nella stessa cartella di
     questa pagina (accanto a musica-peyron.html).
  2) Aggiungi un nuovo blocco { ... } dentro l'array "tools"
     qui sotto, nel tag <script>: titolo, descrizione breve,
     etichetta (es. "Teoria", "Ritmo"), un'emoji e "url" col
     nome del file appena caricato.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #EAF2FF;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 12% 8%, #1c4d7c 0%, transparent 32%),
      radial-gradient(circle at 88% 92%, #14345e 0%, transparent 36%),
      linear-gradient(160deg, #050a16 0%, #0b1c38 48%, #0e2a4d 100%);
    overflow-x: hidden;
  }

  /* ---------- hero ---------- */
  header.hero {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 24px 16px;
    text-align: center;
  }

  header.hero h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(19px, 3.4vw, 25px);
    line-height: 1.2;
    margin: 0 0 6px;
    letter-spacing: -0.015em;
  }

  header.hero p {
    font-size: 12.5px;
    color: #9FB3CE;
    font-weight: 500;
    line-height: 1.45;
    max-width: 380px;
    margin: 0 auto;
  }

  /* ---------- staff line signature ---------- */
  .staff {
    max-width: 300px;
    margin: 14px auto 0;
    height: 32px;
    position: relative;
  }
  .staff svg { width: 100%; height: 100%; display: block; }
  .staff line {
    stroke: rgba(255,255,255,0.14);
    stroke-width: 1;
  }
  .staff circle {
    fill: #5EC8D8;
  }
  .staff .note-path {
    animation: travel 7s linear infinite;
  }
  @keyframes travel {
    0%   { transform: translateX(0); }
    100% { transform: translateX(260px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .staff .note-path { animation: none; }
  }

  /* ---------- tools grid ---------- */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }

  .card {
    position: relative;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 12px 12px 10px;
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    display: flex;
    flex-direction: column;
    min-height: 118px;
  }

  .card:hover {
    border-color: rgba(94, 200, 216, 0.45);
    background: rgba(255,255,255,0.055);
    transform: translateY(-2px);
  }

  .card .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 7px;
  }

  .card .icon {
    width: 25px;
    height: 25px;
    border-radius: 7px;
    background: rgba(94, 200, 216, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .card .label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #7FD8E4;
    background: rgba(94, 200, 216, 0.1);
    padding: 2px 7px;
    border-radius: 999px;
  }

  .card h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .card p {
    font-size: 11px;
    line-height: 1.4;
    color: #9FB3CE;
    font-weight: 500;
    margin: 0 0 9px;
    flex: 1;
  }

  .card a.open {
    align-self: flex-start;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: #061323;
    background: #EAF2FF;
    text-decoration: none;
    padding: 5px 12px;
    border-radius: 7px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .card a.open:hover {
    background: #5EC8D8;
    transform: translateX(2px);
  }

  /* empty slot */
  .card.empty {
    align-items: center;
    justify-content: center;
    text-align: center;
    border-style: dashed;
    background: transparent;
    color: #64789A;
    min-height: 118px;
  }
  .card.empty:hover { transform: none; border-color: rgba(255,255,255,0.14); }
  .card.empty .plus {
    font-family: 'Manrope', sans-serif;
    font-size: 17px;
    color: #5EC8D8;
    margin-bottom: 2px;
  }
  .card.empty div:last-child {
    font-size: 10.5px;
  }

  footer {
    text-align: center;
    padding: 0 20px 22px;
    font-size: 10.5px;
    color: #5C7091;
  }
</style>
</head>
<body>

<header class="hero">
  <h1>Piccoli strumenti per imparare la musica.</h1>
  <p>Esercizi interattivi per allenare orecchio, teoria e ritmo un passo alla volta.</p>

  <div class="staff" aria-hidden="true">
    <svg viewBox="0 0 300 32" preserveAspectRatio="none">
      <line x1="0" y1="5"  x2="300" y2="5"></line>
      <line x1="0" y1="11.5" x2="300" y2="11.5"></line>
      <line x1="0" y1="18" x2="300" y2="18"></line>
      <line x1="0" y1="24.5" x2="300" y2="24.5"></line>
      <line x1="0" y1="31" x2="300" y2="31"></line>
      <g class="note-path">
        <circle cx="5" cy="11.5" r="3"></circle>
      </g>
    </svg>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>una raccolta personale di esercizi musicali</footer>

<script>
  /* ============================================================
     I TUOI STRUMENTI / GIOCHI — modifica qui
     ============================================================ */
  const tools = [
    {
      title: "Test d'Ingresso",
      icon: "📝",
      label: "Verifica",
      desc: "Una versione breve di quattro giochi didattici, per testare le conoscenze di partenza.",
      url: "test-ingresso.html"
    },
    {
      title: "Acuto, Grave o Unisono?",
      icon: "👂",
      label: "Ascolto",
      desc: "Allena l'orecchio a distinguere suoni acuti, gravi e all'unisono.",
      url: "acuto-o-grave.html"
    },
    {
      title: "Recita le Note",
      icon: "🗣️",
      label: "Teoria",
      desc: "Impara a recitare la scala do-re-mi-fa-sol-la-si-do e ritorno, partendo da ogni nota.",
      url: "recita-le-note.html"
    },
    {
      title: "Leggi la Nota",
      icon: "🎵",
      label: "Teoria",
      desc: "Impara a leggere le note sul pentagramma, una alla volta.",
      url: "leggi-la-nota.html"
    },
    {
      title: "Figure Ritmiche",
      icon: "🎼",
      label: "Ritmo",
      desc: "Riconosci nomi, pause e valori delle figure musicali.",
      url: "figure-ritmiche.html"
    },
    {
      title: "Costruttore di Battute",
      icon: "🥁",
      label: "Ritmo",
      desc: "Componi battute scegliendo e disponendo le figure ritmiche.",
      url: "costruttore-di-battute.html"
    },
    {
      title: "Le Note sul Pianoforte",
      icon: "🎹",
      label: "Teoria",
      desc: "Riconosci le note sulla tastiera, tasto dopo tasto.",
      url: "tastierapianoforte.html"
    },
    {
      title: "Imita il Ritmo",
      icon: "👏",
      label: "Ritmo",
      desc: "Ascolta uno schema ritmico e riproducilo battendo il tempo.",
      url: "imita-il-ritmo.html"
    },
    {
      title: "Le Qualità del Suono",
      icon: "🌊",
      label: "Teoria",
      desc: "Esplora altezza, intensità, timbro e come viaggia un'onda sonora.",
      url: "qualita-del-suono.html"
    },
    {
      title: "Nomina gli Intervalli",
      icon: "📏",
      label: "Teoria",
      desc: "Riconosci e nomina gli intervalli musicali sul pentagramma.",
      url: "nomina-intervalli.html"
    },
    {
      title: "Ascolta gli Intervalli",
      icon: "👂",
      label: "Ascolto",
      desc: "Allena l'orecchio a riconoscere gli intervalli, ascendenti o discendenti.",
      url: "ascolta-intervalli.html"
    },
    {
      title: "Ascolta la Scala",
      icon: "👂",
      label: "Ascolto",
      desc: "Riconosci a orecchio il tipo di scala: maggiore o minore, naturale, armonica o melodica.",
      url: "ascolta-scala.html"
    },
    {
      title: "Identifica la Tonalità",
      icon: "🔑",
      label: "Teoria",
      desc: "Riconosci a colpo d'occhio la tonalità maggiore e la relativa minore di un'armatura di chiave.",
      url: "identifica-tonalita.html"
    },
    {
      title: "Nomina la Triade",
      icon: "🎶",
      label: "Teoria",
      desc: "Riconosci e nomina le triadi, con armature fino a due alterazioni.",
      url: "nomina-triade.html"
    },
    {
      title: "Triadi in Contesto Tonale",
      icon: "🎻",
      label: "Teoria",
      desc: "Costruisci tutte le triadi diatoniche di una scala maggiore o minore.",
      url: "triadi-tonali.html"
    },
    {
      title: "Costruisci la Triade",
      icon: "🔨",
      label: "Teoria",
      desc: "Posiziona le note sul pentagramma e usa le frecce per alterarle e formare la triade.",
      url: "costruisci-triade.html"
    },
    {
      title: "Identifica gli Accordi",
      icon: "🎯",
      label: "Teoria",
      desc: "Riconosci a colpo d'occhio la qualità degli accordi, anche nei loro rivolti.",
      url: "identifica-accordi.html"
    },
    {
      title: "Ascolta gli Accordi",
      icon: "👂",
      label: "Ascolto",
      desc: "Riconosci a orecchio la qualità degli accordi, anche nei loro rivolti.",
      url: "ascolta-accordi.html"
    },
    {
      title: "Note-UNO",
      icon: "🃏",
      label: "Teoria",
      desc: "Un gioco di carte in stile UNO per allenarsi con le note musicali.",
      url: "note-uno.html"
    }
  ];

  const grid = document.getElementById('grid');

  tools.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top-row">
        <div class="icon">${t.icon}</div>
        <span class="label">${t.label}</span>
      </div>
      <h2>${t.title}</h2>
      <p>${t.desc}</p>
      <a class="open" href="${t.url}">Apri →</a>
    `;
    grid.appendChild(card);
  });

  const empty = document.createElement('div');
  empty.className = 'card empty';
  empty.innerHTML = `<div class="plus">+</div><div>Prossimo strumento in arrivo</div>`;
  grid.appendChild(empty);
</script>

</body>
</html>
